<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mauzo - Dukamkononi Muuzaji</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        /* Main layout wrapper - sidebar + content */
        .muuzaji-layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR - Persistent navigation */
        .sidebar {
            width: 280px;
            background-color: #ffffff;
            border-right: 1px solid #ecf0f1;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s ease;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.05);
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid #ecf0f1;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-text h2 {
            font-size: 18px;
            font-weight: 800;
            color: #2c3e50;
        }

        .logo-text p {
            font-size: 12px;
            color: #7f8c8d;
        }

        .nav-items {
            flex: 1;
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            margin-bottom: 8px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #5d6d7e;
            font-weight: 500;
            text-decoration: none;
        }

        .nav-item:hover {
            background-color: #e8f8f0;
        }

        .nav-item.active {
            background-color: #e8f8f0;
            color: #2ecc71;
        }

        .nav-icon {
            font-size: 22px;
            width: 28px;
        }

        .nav-label {
            font-size: 15px;
            font-weight: 600;
        }

        .sidebar-footer {
            padding: 20px 16px;
            border-top: 1px solid #ecf0f1;
            margin-top: auto;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background-color: #e8f8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2ecc71;
            font-weight: bold;
            font-size: 18px;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            font-weight: 700;
            color: #2c3e50;
        }

        .user-role {
            font-size: 12px;
            color: #2ecc71;
            font-weight: 600;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background-color: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e74c3c;
            font-weight: 600;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: #fdeaea;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            margin-left: 280px;
            min-height: 100vh;
            background-color: #f8f9fa;
            padding: 20px 24px 40px;
        }

        /* Mobile menu toggle */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        /* Page container */
        .page-container {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* Loading */
        .loading-container {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #e0e0e0;
            border-top-color: #2ecc71;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #7f8c8d;
            font-size: 14px;
        }

        /* Header */
        .header {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .back-btn {
            background: #f5f5f5;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            color: #2c3e50;
            font-size: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
        }

        .refresh-btn {
            background: #e8f8f0;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 18px;
        }

        .date-title {
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 16px;
        }

        .closed-badge {
            color: #e74c3c;
            font-weight: 700;
        }

        /* Stats */
        .stats-container {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 16px;
            border-radius: 16px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #2196F3;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: #7f8c8d;
        }

        /* Sales List */
        .sales-list {
            flex: 1;
        }

        .sale-item {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .sale-item.closed {
            background: #f8f9fa;
            opacity: 0.8;
        }

        .sale-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .invoice-number {
            font-weight: 700;
            color: #2c3e50;
        }

        .sale-time {
            font-size: 12px;
            color: #95a5a6;
        }

        .sale-total {
            font-weight: 700;
            color: #27ae60;
            font-size: 16px;
        }

        .product-row, .customer-row, .payment-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .product-name {
            flex: 1;
            font-size: 14px;
            color: #2c3e50;
        }

        .quantity {
            font-size: 13px;
            color: #7f8c8d;
        }

        .customer-name {
            font-size: 14px;
            color: #2c3e50;
            font-weight: 500;
        }

        .payment-text {
            font-size: 12px;
            color: #3498db;
        }

        .notes-text {
            font-size: 11px;
            color: #95a5a6;
            font-style: italic;
        }

        .sale-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #ecf0f1;
        }

        .date-text {
            font-size: 11px;
            color: #95a5a6;
        }

        .sale-actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn, .receipt-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .edit-btn {
            background: #e8f4fd;
            color: #3498db;
        }

        .receipt-btn {
            background: #e8f7ef;
            color: #27ae60;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: white;
            border-radius: 20px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-text {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .go-sell-btn {
            background: #2ecc71;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        /* Close Sales Button */
        .close-sales-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #e74c3c;
            margin: 16px 0;
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            color: white;
            font-weight: 700;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid #ecf0f1;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .close-modal {
            cursor: pointer;
            font-size: 24px;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
        }

        .form-input.readonly {
            background: #f5f5f5;
            color: #666;
        }

        .field-hint {
            font-size: 11px;
            color: #95a5a6;
            margin-top: 4px;
        }

        .summary-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
        }

        .summary-title {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .summary-divider {
            height: 1px;
            background: #ecf0f1;
            margin: 10px 0;
        }

        .total-label {
            font-weight: 700;
        }

        .total-value {
            font-weight: 700;
            color: #27ae60;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            padding: 20px;
            border-top: 1px solid #ecf0f1;
        }

        .cancel-btn {
            flex: 1;
            padding: 12px;
            background: #f8f9fa;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .save-btn {
            flex: 1;
            padding: 12px;
            background: #2196F3;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        /* Confirm Modal */
        .confirm-modal {
            background: white;
            border-radius: 24px;
            width: 85%;
            max-width: 400px;
            padding: 24px;
            text-align: center;
        }

        .warning-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .confirm-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .confirm-text {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .confirm-buttons {
            display: flex;
            gap: 12px;
        }

        .confirm-cancel {
            flex: 1;
            padding: 12px;
            background: #f8f9fa;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .confirm-close {
            flex: 1;
            padding: 12px;
            background: #e74c3c;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 20px 16px;
                padding-top: 70px;
            }
            .mobile-menu-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-menu-toggle" id="mobileMenuToggle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2">
            <path d="M3 12H21M3 6H21M3 18H21"/>
        </svg>
    </div>

    <div class="muuzaji-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <div class="logo-icon">D</div>
                    <div class="logo-text">
                        <h2>DukaMkononi</h2>
                        <p>Muuzaji Portal</p>
                    </div>
                </div>
            </div>
            <div class="nav-items">
                <a href="profaili.html" class="nav-item">
                    <div class="nav-icon">👤</div>
                    <span class="nav-label">Profaili</span>
                </a>
                <a href="mauzo.html" class="nav-item active">
                    <div class="nav-icon">💰</div>
                    <span class="nav-label">Mauzo</span>
                </a>
                <a href="matumizi.html" class="nav-item">
                    <div class="nav-icon">📊</div>
                    <span class="nav-label">Matumizi</span>
                </a>
                <a href="uza.html" class="nav-item">
                    <div class="nav-icon">🛒</div>
                    <span class="nav-label">Uza</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">M</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Muuzaji</div>
                        <div class="user-role">Muuzaji</div>
                    </div>
                </div>
                <div class="logout-btn" id="logoutBtn">
                    <span>🚪</span>
                    <span>Ondoka</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-container" id="mauzoContent">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Inapakua data ya mauzo...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Hariri Mauzo</div>
                <div class="close-modal" onclick="closeEditModal()">✖</div>
            </div>
            <div class="modal-body" id="editModalBody"></div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeEditModal()">Ghairi</button>
                <button class="save-btn" onclick="updateSale()">Hifadhi Mabadiliko</button>
            </div>
        </div>
    </div>

    <!-- Confirm Close Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="confirm-modal">
            <div class="warning-icon">⚠️</div>
            <div class="confirm-title">Funga Mauzo Ya Leo?</div>
            <div class="confirm-text" id="confirmText"></div>
            <div class="confirm-buttons">
                <button class="confirm-cancel" onclick="closeConfirmModal()">Ghairi</button>
                <button class="confirm-close" onclick="closeTodaySales()">🔒 Funga Mauzo</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://duka-mkononi-backend-4476.onrender.com';
        
        let salesData = [];
        let loading = true;
        let todayClosed = false;
        let selectedSale = null;
        let editForm = { quantity: '', unit_price: '', customer_name: '', product_name: '', sale_item_id: '' };
        
        const today = new Date().toISOString().split('T')[0];

        function getCurrentUser() {
            const token = localStorage.getItem('userToken');
            const userData = localStorage.getItem('userData');
            if (token && userData) {
                try {
                    return JSON.parse(userData);
                } catch(e) { return null; }
            }
            return null;
        }

        function updateSidebarUser() {
            const user = getCurrentUser();
            if (user) {
                const displayName = user.full_name || user.business_name || user.email?.split('@')[0] || 'Muuzaji';
                document.getElementById('userName').innerHTML = escapeHtml(displayName);
                document.getElementById('userAvatar').innerHTML = displayName.charAt(0).toUpperCase();
            }
        }

        function checkAuth() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = '/login.html?role=muuzaji';
                return false;
            }
            const userRole = user.role || '';
            if (userRole !== 'seller' && userRole !== 'muuzaji') {
                alert('Huna ruhusa ya kuingia kwenye eneo la Muuzaji.');
                window.location.href = '/home.html';
                return false;
            }
            return true;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
        }

        function formatCurrency(amount) {
            return `TZS ${(amount || 0).toLocaleString()}`;
        }

        function formatDate(dateStr) {
            try {
                return new Date(dateStr).toLocaleDateString('sw-TZ', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });
            } catch { return dateStr; }
        }

        function formatTime(dateStr) {
            try {
                return new Date(dateStr).toLocaleTimeString('sw-TZ', { hour: '2-digit', minute: '2-digit' });
            } catch { return ''; }
        }

        function getCustomerName(sale) {
            if (sale.customer_name && sale.customer_name.trim()) return sale.customer_name.trim();
            if (sale.notes && sale.notes.includes('Mteja:')) {
                const match = sale.notes.match(/Mteja:\s*(.+)/);
                if (match && match[1]) return match[1].trim();
            }
            if (sale.customer?.name) return sale.customer.name;
            if (sale.customer_data?.name) return sale.customer_data.name;
            return 'Mteja Bila Jina';
        }

        async function loadSalesData() {
            const token = localStorage.getItem('userToken');
            if (!token) return;
            
            loading = true;
            render();
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/sales/my`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('API Error');
                
                const data = await response.json();
                if (!Array.isArray(data)) {
                    salesData = [];
                } else {
                    const processedData = data.map(sale => ({
                        ...sale,
                        display_customer_name: getCustomerName(sale)
                    }));
                    salesData = processedData.filter(sale => {
                        const saleDate = sale.sale_date || sale.created_at?.split('T')[0];
                        return saleDate === today;
                    });
                }
                
                checkIfTodaySalesClosed();
            } catch (error) {
                console.error('Error loading sales:', error);
                salesData = [];
            } finally {
                loading = false;
                render();
            }
        }

        function checkIfTodaySalesClosed() {
            const closedKey = `closed_sales_${today}`;
            todayClosed = localStorage.getItem(closedKey) === 'true';
            render();
        }

        async function updateSale() {
            if (!selectedSale) return;
            
            const token = localStorage.getItem('userToken');
            const quantity = parseInt(editForm.quantity) || selectedSale.sale_items?.[0]?.quantity || 1;
            
            const updateData = {
                customer_name: editForm.customer_name.trim(),
                notes: `Mteja: ${editForm.customer_name.trim()}`,
                total_amount: quantity * (parseFloat(editForm.unit_price) || 0)
            };
            
            if (editForm.sale_item_id) {
                updateData.sale_items = [{
                    id: editForm.sale_item_id,
                    quantity: quantity,
                    unit_price: parseFloat(editForm.unit_price) || 0,
                    total_price: quantity * (parseFloat(editForm.unit_price) || 0)
                }];
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/sales/${selectedSale.id}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });
                
                if (response.ok) {
                    alert('Mauzo yamehaririwa kikamilifu!');
                    closeEditModal();
                    await loadSalesData();
                } else {
                    alert('Imeshindikana kuhariri mauzo');
                }
            } catch (error) {
                alert('Hitilafu ya mtandao');
            }
        }

        async function closeTodaySales() {
            const closedKey = `closed_sales_${today}`;
            localStorage.setItem(closedKey, 'true');
            todayClosed = true;
            closeConfirmModal();
            alert('Mauzo ya leo yamefungwa kikamilifu!');
            render();
        }

        async function generateReceipt(sale) {
            const customerName = sale.display_customer_name || getCustomerName(sale);
            const saleItem = sale.sale_items?.[0];
            const productName = saleItem?.products?.name || 'Bidhaa';
            const quantity = saleItem?.quantity || 0;
            const unitPrice = saleItem?.unit_price || 0;
            const total = sale.total_amount || 0;
            const date = new Date(sale.sale_date || sale.created_at);
            
            const receiptHtml = `
                <div style="text-align:center;padding:20px;font-family:Arial;">
                    <h2>DUKAMKONONI</h2>
                    <h3>RISITI YA MAUZO</h3>
                    <hr>
                    <p><strong>Nambari:</strong> ${sale.invoice_number || sale.id.substring(0,8)}</p>
                    <p><strong>Tarehe:</strong> ${date.toLocaleDateString('sw-TZ')}</p>
                    <p><strong>Muda:</strong> ${date.toLocaleTimeString('sw-TZ')}</p>
                    <p><strong>Mteja:</strong> ${customerName}</p>
                    <hr>
                    <table style="width:100%;border-collapse:collapse;">
                        <tr><th>Bidhaa</th><th>Kiasi</th><th>Bei</th><th>Jumla</th></tr>
                        <tr><td>${productName}</td><td>${quantity}</td><td>${formatCurrency(unitPrice)}</td><td>${formatCurrency(quantity * unitPrice)}</td></tr>
                    </table>
                    <hr>
                    <p><strong>Jumla:</strong> ${formatCurrency(total)}</p>
                    <hr>
                    <p>Asante kwa Kununua Nasi!</p>
                    <p style="font-size:12px;">www.dukamkononi.com</p>
                </div>
            `;
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html><head><title>Risiti - ${sale.invoice_number || sale.id}</title></head>
                <body onload="window.print();window.close();">${receiptHtml}</body></html>
            `);
            printWindow.document.close();
        }

        function openEditModal(sale) {
            if (todayClosed) {
                alert('Mauzo ya leo yamefungwa, hayawezi kuhaririwa tena.');
                return;
            }
            
            selectedSale = sale;
            const saleItem = sale.sale_items?.[0];
            const customerName = sale.display_customer_name || getCustomerName(sale);
            
            editForm = {
                quantity: saleItem?.quantity?.toString() || '1',
                unit_price: saleItem?.unit_price?.toString() || '',
                customer_name: customerName,
                product_name: saleItem?.products?.name || 'Bidhaa',
                sale_item_id: saleItem?.id || ''
            };
            
            renderEditModal();
            document.getElementById('editModal').style.display = 'flex';
        }

        function renderEditModal() {
            const body = document.getElementById('editModalBody');
            body.innerHTML = `
                <div class="form-group">
                    <label class="form-label">Nambari ya Ankra</label>
                    <input class="form-input readonly" value="${escapeHtml(selectedSale?.invoice_number || selectedSale?.id)}" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Jina la Bidhaa</label>
                    <input class="form-input readonly" value="${escapeHtml(editForm.product_name)}" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Kiasi</label>
                    <input type="number" id="editQuantity" class="form-input" value="${editForm.quantity}">
                </div>
                <div class="form-group">
                    <label class="form-label">Bei ya Uuzaji (TZS)</label>
                    <input class="form-input readonly" value="${editForm.unit_price}" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Jina la Mteja *</label>
                    <input type="text" id="editCustomerName" class="form-input" value="${escapeHtml(editForm.customer_name)}" placeholder="Weka jina la mteja">
                </div>
                <div class="summary-box">
                    <div class="summary-title">Muhtasari wa Mabadiliko</div>
                    <div class="summary-row"><span>Bidhaa:</span><span>${escapeHtml(editForm.product_name)}</span></div>
                    <div class="summary-row"><span>Kiasi (Zamani):</span><span>${selectedSale?.sale_items?.[0]?.quantity || 0}</span></div>
                    <div class="summary-row"><span>Kiasi (Mpya):</span><span id="newQuantityDisplay">${editForm.quantity}</span></div>
                    <div class="summary-row"><span>Bei ya Uuzaji:</span><span>${formatCurrency(parseFloat(editForm.unit_price))}</span></div>
                    <div class="summary-row"><span>Mteja:</span><span id="newCustomerDisplay">${escapeHtml(editForm.customer_name) || 'Bila Jina'}</span></div>
                    <div class="summary-divider"></div>
                    <div class="summary-row total-label"><span>Jumla kamili:</span><span class="total-value">${formatCurrency(selectedSale?.total_amount || 0)}</span></div>
                </div>
            `;
            
            const quantityInput = document.getElementById('editQuantity');
            const customerInput = document.getElementById('editCustomerName');
            
            if (quantityInput) {
                quantityInput.addEventListener('input', (e) => {
                    editForm.quantity = e.target.value;
                    document.getElementById('newQuantityDisplay').innerText = e.target.value;
                });
            }
            if (customerInput) {
                customerInput.addEventListener('input', (e) => {
                    editForm.customer_name = e.target.value;
                    document.getElementById('newCustomerDisplay').innerText = e.target.value || 'Bila Jina';
                });
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            selectedSale = null;
        }

        function openConfirmModal() {
            const total = salesData.reduce((sum, s) => sum + (s.total_amount || 0), 0);
            const customers = new Set(salesData.map(s => getCustomerName(s))).size;
            document.getElementById('confirmText').innerHTML = `
                Mauzo ${salesData.length} ya leo yatafungwa na hayawezi kuhaririwa tena.<br><br>
                Jumla ya leo: ${formatCurrency(total)}<br><br>
                Wateja walionunua leo: ${customers}
            `;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        function render() {
            const container = document.getElementById('mauzoContent');
            
            if (loading) {
                container.innerHTML = `<div class="loading-container"><div class="loading-spinner"></div><div class="loading-text">Inapakua data ya mauzo...</div></div>`;
                return;
            }
            
            const totalAmount = salesData.reduce((sum, s) => sum + (s.total_amount || 0), 0);
            const uniqueCustomers = new Set(salesData.map(s => getCustomerName(s))).size;
            
            const salesHtml = salesData.map(sale => {
                const saleItem = sale.sale_items?.[0];
                const customerName = sale.display_customer_name || getCustomerName(sale);
                return `
                    <div class="sale-item ${todayClosed ? 'closed' : ''}">
                        <div class="sale-header">
                            <div><span class="invoice-number">#${escapeHtml(sale.invoice_number || sale.id.substring(0,8))}</span> <span class="sale-time">${formatTime(sale.created_at || sale.sale_date)}</span></div>
                            <div class="sale-total">${formatCurrency(sale.total_amount)}</div>
                        </div>
                        <div class="product-row"><span>📦</span><span class="product-name">${escapeHtml(saleItem?.products?.name || 'Bidhaa')}</span><span class="quantity">${saleItem?.quantity || 0} × ${formatCurrency(saleItem?.unit_price || 0)}</span></div>
                        <div class="customer-row"><span>👤</span><span class="customer-name">${escapeHtml(customerName)}</span></div>
                        ${sale.payment_method ? `<div class="payment-row"><span>💳</span><span class="payment-text">${sale.payment_method === 'cash' ? 'Fedha Taslimu' : 'Malipo ya Kadi'}</span></div>` : ''}
                        ${sale.notes ? `<div class="notes-text">📝 ${escapeHtml(sale.notes)}</div>` : ''}
                        <div class="sale-footer">
                            <div class="date-text">${formatDate(sale.sale_date || sale.created_at)}</div>
                            <div class="sale-actions">
                                ${!todayClosed ? `<div class="edit-btn" onclick="openEditModal(${JSON.stringify(sale).replace(/"/g, '&quot;')})">✏️ Hariri</div>` : ''}
                                <div class="receipt-btn" onclick="generateReceipt(${JSON.stringify(sale).replace(/"/g, '&quot;')})">📄 Dai Risiti</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = `
                <div class="header">
                    <div class="header-top">
                        <a href="profaili.html" class="back-btn">←</a>
                        <div class="title">Mauzo Ya Leo</div>
                        <button class="refresh-btn" onclick="loadSalesData()">⟳</button>
                    </div>
                    <div class="date-title">${formatDate(today)}${todayClosed ? '<span class="closed-badge"> • IMEFUNGWA</span>' : ''}</div>
                    <div class="stats-container">
                        <div class="stat-item"><div class="stat-value">${salesData.length}</div><div class="stat-label">Mauzo</div></div>
                        <div class="stat-item"><div class="stat-value">${formatCurrency(totalAmount)}</div><div class="stat-label">Jumla Ya Leo</div></div>
                        <div class="stat-item"><div class="stat-value">${uniqueCustomers}</div><div class="stat-label">Wateja</div></div>
                    </div>
                </div>
                <div class="sales-list">
                    ${salesData.length === 0 ? `
                        <div class="empty-state">
                            <div class="empty-icon">📋</div>
                            <div class="empty-title">Hakuna Mauzo Ya Leo</div>
                            <div class="empty-text">Bado haujafanya mauzo yoyote leo. Nenda kwenye ukurasa wa kuuza.</div>
                            <a href="uza.html" class="go-sell-btn">🛒 Nenda Kuuza</a>
                        </div>
                    ` : salesHtml}
                </div>
                ${salesData.length > 0 && !todayClosed ? `<div class="close-sales-btn" onclick="openConfirmModal()">🔒 FUNGA MAUZO YA LEO</div>` : ''}
            `;
        }

        function setupSidebar() {
            const toggle = document.getElementById('mobileMenuToggle');
            const sidebar = document.getElementById('sidebar');
            if (toggle && sidebar) {
                toggle.addEventListener('click', () => sidebar.classList.toggle('open'));
            }
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.clear();
                    window.location.href = '/login.html?role=muuzaji';
                });
            }
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    const sidebar = document.getElementById('sidebar');
                    const toggle = document.getElementById('mobileMenuToggle');
                    if (sidebar && sidebar.classList.contains('open') && 
                        !sidebar.contains(e.target) && toggle && !toggle.contains(e.target)) {
                        sidebar.classList.remove('open');
                    }
                }
            });
        }

        window.loadSalesData = loadSalesData;
        window.openEditModal = openEditModal;
        window.closeEditModal = closeEditModal;
        window.updateSale = updateSale;
        window.openConfirmModal = openConfirmModal;
        window.closeConfirmModal = closeConfirmModal;
        window.closeTodaySales = closeTodaySales;
        window.generateReceipt = generateReceipt;

        async function init() {
            if (!checkAuth()) return;
            updateSidebarUser();
            setupSidebar();
            await loadSalesData();
        }
        
        init();
    </script>
</body>
</html>
