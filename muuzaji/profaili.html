<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profaili - Dukamkononi Muuzaji</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        /* Main layout wrapper - sidebar + content */
        .muuzaji-layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR - Persistent navigation */
        .sidebar {
            width: 280px;
            background-color: #ffffff;
            border-right: 1px solid #ecf0f1;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s ease;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.05);
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid #ecf0f1;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-text h2 {
            font-size: 18px;
            font-weight: 800;
            color: #2c3e50;
        }

        .logo-text p {
            font-size: 12px;
            color: #7f8c8d;
        }

        .nav-items {
            flex: 1;
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            margin-bottom: 8px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #5d6d7e;
            font-weight: 500;
            text-decoration: none;
        }

        .nav-item:hover {
            background-color: #e8f8f0;
        }

        .nav-item.active {
            background-color: #e8f8f0;
            color: #2ecc71;
        }

        .nav-icon {
            font-size: 22px;
            width: 28px;
        }

        .nav-label {
            font-size: 15px;
            font-weight: 600;
        }

        .sidebar-footer {
            padding: 20px 16px;
            border-top: 1px solid #ecf0f1;
            margin-top: auto;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background-color: #e8f8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2ecc71;
            font-weight: bold;
            font-size: 18px;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            font-weight: 700;
            color: #2c3e50;
        }

        .user-role {
            font-size: 12px;
            color: #2ecc71;
            font-weight: 600;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background-color: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e74c3c;
            font-weight: 600;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: #fdeaea;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            margin-left: 280px;
            min-height: 100vh;
            background-color: #f8f9fa;
            padding: 20px 24px 40px;
        }

        /* Mobile menu toggle */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        /* Page container */
        .page-container {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* Loading */
        .loading-container {
            text-align: center;
            padding: 60px 20px;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #e0e0e0;
            border-top-color: #2ecc71;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #7f8c8d; font-size: 14px; }

        /* Header */
        .header {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .title { font-size: 24px; font-weight: 800; color: #2c3e50; }
        .header-actions { display: flex; gap: 12px; }
        .header-btn {
            background: #f5f5f5;
            width: 40px; height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Profile Card */
        .profile-card {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .avatar-section { text-align: center; }
        .avatar {
            width: 90px; height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .avatar-text { color: white; font-size: 32px; font-weight: bold; }
        .role-badge {
            background: #f8f9fa;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .user-info { flex: 1; }
        .user-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .user-email { font-size: 14px; color: #7f8c8d; margin-bottom: 8px; }
        .business-info { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .edit-profile-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #e8f4fd;
            padding: 10px 16px;
            border-radius: 10px;
            margin-top: 12px;
            cursor: pointer;
            width: fit-content;
        }

        /* Stats Section */
        .stats-section { margin-bottom: 20px; }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .stats-subtitle { font-size: 13px; color: #7f8c8d; font-weight: normal; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }
        .stat-card {
            background: white;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
        }
        .stat-icon {
            width: 48px; height: 48px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
        }
        .stat-value { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .stat-label { font-size: 12px; color: #7f8c8d; }
        .stats-note { font-size: 12px; color: #95a5a6; text-align: center; margin-top: 12px; font-style: italic; }

        /* Info Card */
        .info-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ecf0f1;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { display: flex; align-items: center; gap: 8px; color: #7f8c8d; }
        .info-value { font-weight: 500; color: #2c3e50; text-align: right; }
        .status-badge { padding: 4px 12px; border-radius: 20px; }
        .status-text { font-size: 12px; font-weight: 600; }

        /* Logout Button */
        .logout-section { margin: 20px 0; }
        .logout-btn-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #e74c3c;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            color: white;
            font-weight: 700;
        }

        /* Footer */
        .footer { text-align: center; padding: 20px; }
        .footer-text { font-size: 12px; color: #95a5a6; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 450px;
            padding: 24px;
        }
        .modal-title { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 4px; }
        .modal-subtitle { font-size: 13px; color: #7f8c8d; text-align: center; margin-bottom: 20px; }
        .input-label { font-size: 14px; font-weight: 600; margin-bottom: 6px; display: block; }
        .input-field {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 8px; }
        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancel { background: #95a5a6; color: white; }
        .btn-save { background: #3498db; color: white; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px 16px; padding-top: 70px; }
            .mobile-menu-toggle { display: block; }
            .profile-card { flex-direction: column; align-items: center; text-align: center; }
            .user-info { text-align: center; }
            .business-info { justify-content: center; }
            .edit-profile-btn { margin: 12px auto 0; }
            .info-row { flex-direction: column; gap: 8px; }
            .info-value { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="mobile-menu-toggle" id="mobileMenuToggle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2">
            <path d="M3 12H21M3 6H21M3 18H21"/>
        </svg>
    </div>

    <div class="muuzaji-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <div class="logo-icon">D</div>
                    <div class="logo-text">
                        <h2>DukaMkononi</h2>
                        <p>Muuzaji Portal</p>
                    </div>
                </div>
            </div>
            <div class="nav-items">
                <a href="profaili.html" class="nav-item active">
                    <div class="nav-icon">👤</div>
                    <span class="nav-label">Profaili</span>
                </a>
                <a href="mauzo.html" class="nav-item">
                    <div class="nav-icon">💰</div>
                    <span class="nav-label">Mauzo</span>
                </a>
                <a href="matumizi.html" class="nav-item">
                    <div class="nav-icon">📊</div>
                    <span class="nav-label">Matumizi</span>
                </a>
                <a href="uza.html" class="nav-item">
                    <div class="nav-icon">🛒</div>
                    <span class="nav-label">Uza</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">M</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Muuzaji</div>
                        <div class="user-role">Muuzaji</div>
                    </div>
                </div>
                <div class="logout-btn" id="logoutBtn">
                    <span>🚪</span>
                    <span>Ondoka</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-container" id="profailiContent">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Inapakua taarifa zako...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Badili Wasifu Wako</div>
            <div class="modal-subtitle">Unaweza kubadili taarifa zako za wasifu</div>
            <label class="input-label">Jina Kamili *</label>
            <input type="text" id="editFullName" class="input-field" placeholder="Weka jina lako kamili">
            <label class="input-label">Namba ya Simu</label>
            <input type="tel" id="editPhone" class="input-field" placeholder="Weka namba yako ya simu">
            <label class="input-label">Jina la Biashara</label>
            <input type="text" id="editBusinessName" class="input-field" placeholder="Weka jina la biashara yako">
            <label class="input-label">Eneo la Biashara</label>
            <input type="text" id="editBusinessLocation" class="input-field" placeholder="Weka eneo la biashara yako">
            <div class="modal-buttons">
                <div class="modal-btn btn-cancel" onclick="closeEditModal()">Ghairi</div>
                <div class="modal-btn btn-save" onclick="updateProfile()">Hifadhi</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '';
        
        let userData = null;
        let businessData = null;
        let stats = { totalProducts: 0, totalSales: 0, totalCustomers: 0, totalRevenue: 0 };
        let loading = true;

        function getCurrentUser() {
            const token = localStorage.getItem('userToken');
            const userDataStr = localStorage.getItem('userData');
            if (token && userDataStr) {
                try { return JSON.parse(userDataStr); } catch(e) { return null; }
            }
            return null;
        }

        function updateSidebarUser() {
            const user = getCurrentUser();
            if (user) {
                const displayName = user.full_name || user.business_name || user.email?.split('@')[0] || 'Muuzaji';
                document.getElementById('userName').innerHTML = escapeHtml(displayName);
                document.getElementById('userAvatar').innerHTML = displayName.charAt(0).toUpperCase();
            }
        }

        function checkAuth() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = '/login.html?role=muuzaji';
                return false;
            }
            const userRole = user.role || '';
            if (userRole !== 'seller' && userRole !== 'muuzaji') {
                alert('Huna ruhusa ya kuingia kwenye eneo la Muuzaji.');
                window.location.href = '/home.html';
                return false;
            }
            return true;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
        }

        function formatCurrency(amount) {
            return `TZS ${(amount || 0).toLocaleString()}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Haijawekwa';
            try {
                return new Date(dateStr).toLocaleDateString('sw-TZ', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            } catch { return dateStr; }
        }

        function getRoleDisplayName(role) {
            const map = { customer: 'MTEJA', seller: 'MUUZAJI', admin: 'MSIMAMIZI' };
            return map[role] || role?.toUpperCase() || 'MTUMIAJI';
        }

        function getRoleColor(role) {
            const map = { customer: '#3498db', seller: '#2ecc71', admin: '#e74c3c' };
            return map[role] || '#2c3e50';
        }

        function getInitials(name) {
            return name?.split(' ').map(w => w.charAt(0)).join('').toUpperCase().substring(0,2) || 'MU';
        }

        async function loadUserData() {
            const token = localStorage.getItem('userToken');
            if (!token) {
                loading = false;
                render();
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/user/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    userData = await response.json();
                    localStorage.setItem('userData', JSON.stringify(userData));
                    updateSidebarUser();
                } else {
                    const stored = localStorage.getItem('userData');
                    if (stored) userData = JSON.parse(stored);
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                const stored = localStorage.getItem('userData');
                if (stored) userData = JSON.parse(stored);
            }
            
            if (userData) await loadBusinessData();
            else loading = false;
        }

        async function loadBusinessData() {
            const token = localStorage.getItem('userToken');
            if (!userData?.business_name) {
                businessData = { business_name: userData?.business_name || 'Personal', is_admin: userData?.role === 'admin' };
                await loadUserStats();
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/business/by-name/${encodeURIComponent(userData.business_name)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const bizInfo = await response.json();
                    if (bizInfo.exists && bizInfo.hasAdmin) {
                        businessData = {
                            id: bizInfo.admin.id,
                            business_name: bizInfo.admin.business_name,
                            is_admin: true,
                            admin_email: bizInfo.admin.email
                        };
                    } else {
                        businessData = { business_name: userData.business_name, is_admin: userData.role === 'admin' };
                    }
                } else {
                    businessData = { business_name: userData.business_name, is_admin: userData.role === 'admin' };
                }
            } catch (error) {
                businessData = { business_name: userData.business_name, is_admin: userData.role === 'admin' };
            }
            
            await loadUserStats();
        }

        async function loadUserStats() {
            const token = localStorage.getItem('userToken');
            let totalProducts = 0, totalSales = 0, totalRevenue = 0, totalCustomers = 0;
            
            try {
                // Load products
                const productsRes = await fetch(`${API_BASE_URL}/api/products/my`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (productsRes.ok) {
                    const products = await productsRes.json();
                    totalProducts = products.length || 0;
                }
                
                // Load sales
                const salesRes = await fetch(`${API_BASE_URL}/api/sales/my`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (salesRes.ok) {
                    const sales = await salesRes.json();
                    totalSales = sales.length || 0;
                    totalRevenue = sales.reduce((sum, sale) => sum + (sale.total_amount || 0), 0);
                }
                
                // Load customers
                const customersRes = await fetch(`${API_BASE_URL}/api/customers/my`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (customersRes.ok) {
                    const customers = await customersRes.json();
                    totalCustomers = customers.length || 0;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
            
            stats = { totalProducts, totalSales, totalCustomers, totalRevenue };
            loading = false;
            render();
        }

        async function updateProfile() {
            const full_name = document.getElementById('editFullName').value;
            const phone = document.getElementById('editPhone').value;
            const business_name = document.getElementById('editBusinessName').value;
            const business_location = document.getElementById('editBusinessLocation').value;
            
            if (!full_name.trim()) {
                alert('Tafadhali weka jina lako kamili');
                return;
            }
            
            const token = localStorage.getItem('userToken');
            if (!token) return;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/user/profile`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, phone, business_name, business_location })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    userData = result.user || { ...userData, full_name, phone, business_name, business_location };
                    localStorage.setItem('userData', JSON.stringify(userData));
                    updateSidebarUser();
                    closeEditModal();
                    alert('Wasifu wako umesasishwa kikamilifu!');
                    location.reload();
                } else {
                    alert('Imeshindikana kusasisha wasifu');
                }
            } catch (error) {
                alert('Hitilafu ya mtandao');
            }
        }

        function openEditModal() {
            document.getElementById('editFullName').value = userData?.full_name || '';
            document.getElementById('editPhone').value = userData?.phone || '';
            document.getElementById('editBusinessName').value = userData?.business_name || '';
            document.getElementById('editBusinessLocation').value = userData?.business_location || '';
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function handleLogout() {
            if (confirm('Una uhakika unataka kutoka?')) {
                localStorage.clear();
                window.location.href = '/login.html?role=muuzaji';
            }
        }

        function refreshData() {
            loading = true;
            render();
            loadUserData();
        }

        function render() {
            const container = document.getElementById('profailiContent');
            
            if (loading || !userData) {
                container.innerHTML = `<div class="loading-container"><div class="loading-spinner"></div><div class="loading-text">Inapakua taarifa zako...</div></div>`;
                return;
            }
            
            const roleColor = getRoleColor(userData.role);
            const roleName = getRoleDisplayName(userData.role);
            const initials = getInitials(userData.full_name || userData.business_name || userData.email);
            const isAdmin = businessData?.is_admin || false;
            
            container.innerHTML = `
                <div class="header">
                    <div class="header-top">
                        <div class="title">Wasifu Wangu</div>
                        <div class="header-actions">
                            <div class="header-btn" onclick="refreshData()">⟳</div>
                            <div class="header-btn" onclick="openEditModal()">✏️</div>
                        </div>
                    </div>
                    <div class="profile-card">
                        <div class="avatar-section">
                            <div class="avatar" style="background: ${roleColor};"><div class="avatar-text">${escapeHtml(initials)}</div></div>
                            <div class="role-badge">${escapeHtml(roleName)}</div>
                        </div>
                        <div class="user-info">
                            <div class="user-name">${escapeHtml(userData.full_name || userData.business_name || userData.email)}</div>
                            <div class="user-email">${escapeHtml(userData.email)}</div>
                            ${businessData?.business_name ? `<div class="business-info"><span>🏢</span> <span>${escapeHtml(businessData.business_name)}${isAdmin ? ' (Msimamizi)' : ''}</span></div>` : ''}
                            ${userData.business_location ? `<div class="business-info"><span>📍</span> <span>${escapeHtml(userData.business_location)}</span></div>` : ''}
                            <div class="edit-profile-btn" onclick="openEditModal()"><span>✏️</span> <span>Badili Taarifa za Wasifu</span></div>
                        </div>
                    </div>
                </div>
                
                <div class="stats-section">
                    <div class="section-title">Takwimu za ${escapeHtml(businessData?.business_name || 'Biashara Yako')} <span class="stats-subtitle">${isAdmin ? '(Zote za Biashara)' : '(Zako Binafsi)'}</span></div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-icon" style="background:#e8f4fd;">📦</div><div class="stat-value">${stats.totalProducts}</div><div class="stat-label">${isAdmin ? 'Bidhaa za Biashara' : 'Bidhaa Zako'}</div></div>
                        <div class="stat-card"><div class="stat-icon" style="background:#f0f8f0;">🛒</div><div class="stat-value">${stats.totalSales}</div><div class="stat-label">${isAdmin ? 'Mauzo ya Biashara' : 'Mauzo Yako'}</div></div>
                        <div class="stat-card"><div class="stat-icon" style="background:#fff8e1;">👥</div><div class="stat-value">${stats.totalCustomers}</div><div class="stat-label">${isAdmin ? 'Wateja wa Biashara' : 'Wateja Wako'}</div></div>
                        <div class="stat-card"><div class="stat-icon" style="background:#fce4ec;">💰</div><div class="stat-value">${formatCurrency(stats.totalRevenue)}</div><div class="stat-label">${isAdmin ? 'Mapato ya Biashara' : 'Mapato Yako'}</div></div>
                    </div>
                    <div class="stats-note">${isAdmin ? 'Takwimu zote za biashara yako' : 'Takwimu zako binafsi katika biashara hii'}</div>
                </div>
                
                <div class="stats-section">
                    <div class="section-title">Taarifa za Akaunti</div>
                    <div class="info-card">
                        <div class="info-row"><div class="info-label"><span>👤</span> Jina Kamili:</div><div class="info-value">${escapeHtml(userData.full_name || 'Haijawekwa')}</div></div>
                        <div class="info-row"><div class="info-label"><span>📧</span> Barua Pepe:</div><div class="info-value">${escapeHtml(userData.email)}</div></div>
                        <div class="info-row"><div class="info-label"><span>📞</span> Namba ya Simu:</div><div class="info-value">${escapeHtml(userData.phone || 'Haijawekwa')}</div></div>
                        <div class="info-row"><div class="info-label"><span>🆔</span> Kitambulisho cha Akaunti:</div><div class="info-value">#${userData.id || 'N/A'}</div></div>
                        ${businessData?.business_name ? `<div class="info-row"><div class="info-label"><span>🏢</span> Biashara:</div><div class="info-value">${escapeHtml(businessData.business_name)}</div></div>` : ''}
                        <div class="info-row"><div class="info-label"><span>📍</span> Eneo la Biashara:</div><div class="info-value">${escapeHtml(userData.business_location || 'Haijawekwa')}</div></div>
                        <div class="info-row"><div class="info-label"><span>⏰</span> Imejisajiliwa:</div><div class="info-value">${formatDate(userData.created_at)}</div></div>
                        <div class="info-row"><div class="info-label"><span>🛡️</span> Hali ya Akaunti:</div><div class="info-value"><span class="status-badge" style="background: ${userData.status === 'approved' ? '#e8f6f3' : userData.status === 'pending' ? '#fef9e7' : '#fdedec'};"><span class="status-text" style="color: ${userData.status === 'approved' ? '#27ae60' : userData.status === 'pending' ? '#f39c12' : '#e74c3c'};">${userData.status === 'approved' ? 'Imethibitishwa' : userData.status === 'pending' ? 'Inasubiri' : 'Imekataliwa'}</span></span></div></div>
                    </div>
                </div>
                
                <div class="logout-section">
                    <div class="logout-btn-main" onclick="handleLogout()"><span>🚪</span> Toka Kwenye Akaunti</div>
                </div>
                
                <div class="footer">
                    <div class="footer-text">Duka Mkononi • ${new Date().getFullYear()}</div>
                    <div class="footer-text" style="font-size: 11px;">Inafanya kazi kwa muuzaji${businessData?.business_name ? ` • ${businessData.business_name}` : ''}</div>
                </div>
            `;
        }

        function setupSidebar() {
            const toggle = document.getElementById('mobileMenuToggle');
            const sidebar = document.getElementById('sidebar');
            if (toggle && sidebar) {
                toggle.addEventListener('click', () => sidebar.classList.toggle('open'));
            }
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', handleLogout);
            }
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    const sidebar = document.getElementById('sidebar');
                    const toggle = document.getElementById('mobileMenuToggle');
                    if (sidebar && sidebar.classList.contains('open') && 
                        !sidebar.contains(e.target) && toggle && !toggle.contains(e.target)) {
                        sidebar.classList.remove('open');
                    }
                }
            });
        }

        window.openEditModal = openEditModal;
        window.closeEditModal = closeEditModal;
        window.updateProfile = updateProfile;
        window.handleLogout = handleLogout;
        window.refreshData = refreshData;

        async function init() {
            if (!checkAuth()) return;
            updateSidebarUser();
            setupSidebar();
            await loadUserData();
        }
        
        init();
    </script>
</body>
</html>
