services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Supabase / Postgres connection (override here or in .env)
      DB_CONNECTION: pgsql
    ports:
      - "80:8080"
    volumes:
      - app_storage:/var/www/html/storage
      - app_backup:/var/www/html/backup
    networks:
      - backend

volumes:
  app_storage:
  app_backup:

networks:
  backend:
