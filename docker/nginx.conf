# DukaMkononi — complete nginx main config for the single-container image.
# Runs as www-data (non-root), so:
#   - listens on 8080 (unprivileged) instead of 80
#   - pid file lives in /tmp
#   - temp/log dirs are chowned to www-data in the Dockerfile

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    client_max_body_size 40m;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        # Security headers (matching the old host's response settings)
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        # Front controller
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # PHP-FPM (same container, loopback)
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 60s;
        }

        # Never serve hidden files
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
