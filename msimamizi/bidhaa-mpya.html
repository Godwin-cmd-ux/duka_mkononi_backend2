    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',-apple-system,sans-serif;background:#f8f9fa}.msimamizi-layout{display:flex;min-height:100vh}.sidebar{width:280px;background:#fff;border-right:1px solid #ecf0f1;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:transform .3s;box-shadow:2px 0 12px rgba(0,0,0,.05)}.sidebar-header{padding:30px 24px;border-bottom:1px solid #ecf0f1}.logo-area{display:flex;align-items:center;gap:12px}.logo-icon{width:45px;height:45px;background:linear-gradient(135deg,#e74c3c,#c0392b);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700}.logo-text h2{font-size:18px;font-weight:800;color:#2c3e50}.logo-text p{font-size:12px;color:#7f8c8d}.nav-items{flex:1;padding:0 16px}.nav-item{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:8px;border-radius:14px;cursor:pointer;transition:all .2s;color:#5d6d7e;font-weight:500;text-decoration:none}.nav-item:hover,.nav-item.active{background:#fdeaea;color:#e74c3c}.nav-icon{font-size:20px;width:24px}.nav-label{font-size:15px;font-weight:600}.sidebar-footer{padding:20px 16px;border-top:1px solid #ecf0f1;margin-top:auto}.user-info{display:flex;align-items:center;gap:12px;margin-bottom:15px}.user-avatar{width:45px;height:45px;background:#fdeaea;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#e74c3c;font-weight:700;font-size:18px;overflow:hidden}.user-name{font-size:14px;font-weight:700;color:#2c3e50}.user-role{font-size:12px;color:#e74c3c;font-weight:600}.logout-btn{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f8f9fa;border-radius:12px;cursor:pointer;color:#e74c3c;font-weight:600;font-size:14px}.main-content{flex:1;margin-left:280px;min-height:100vh;background:#f8f9fa;padding:20px 24px 40px}.mobile-menu-toggle{display:none;position:fixed;top:16px;left:16px;z-index:200;background:#fff;padding:12px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer}.bidhaa-container{max-width:800px;margin:0 auto}.form-card{background:#fff;border-radius:24px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.05)}.input-group{margin-bottom:20px}.label{font-size:15px;font-weight:600;color:#2c3e50;margin-bottom:8px;display:block}input,select{width:100%;padding:14px 16px;font-size:15px;border:1px solid #ddd;border-radius:14px;font-family:'Inter',sans-serif}input:focus,select:focus{outline:none;border-color:#e74c3c;box-shadow:0 0 0 3px rgba(231,76,60,.1)}input:disabled{background:#f5f5f5;color:#999}.price-container{position:relative}.price-preview{position:absolute;right:16px;top:50%;transform:translateY(-50%);text-align:right}.categories-scroll{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.category-chip{background:#fff;border:1px solid #ddd;padding:8px 16px;border-radius:30px;font-size:13px;cursor:pointer;transition:all .2s}.category-chip.selected{background:#2ecc71;border-color:#27ae60;color:#fff;font-weight:600}.submit-btn{width:100%;padding:16px;border-radius:16px;border:none;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:#fff;transition:all .2s}.submit-btn.add{background:#2ecc71}.submit-btn.update{background:#3498db}.submit-btn.addstock{background:#f39c12}.submit-btn.disabled{background:#95a5a6;opacity:.6;cursor:not-allowed}.existing-btn{background:#fff;border:2px dashed #e8f6f3;border-radius:16px;padding:20px;margin-bottom:24px;cursor:pointer;display:flex;align-items:center;gap:15px;transition:all .2s}.existing-btn:hover{border-color:#2ecc71;background:#f0faf5}.selected-banner{background:#f0f8f0;border-radius:16px;padding:16px;margin-bottom:20px;border-left:5px solid #2ecc71}.selected-banner.non-owner{background:#fff9e6;border-left-color:#f39c12}.selected-banner-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.selected-banner-title{font-weight:700;color:#27ae60;font-size:14px}.selected-banner-close{cursor:pointer;color:#e74c3c;font-size:20px;padding:4px}.price-diff{padding:12px 16px;border-radius:12px;margin:10px 0 16px}.price-diff.positive{background:#e8f6f3;border-left:4px solid #27ae60}.price-diff.negative{background:#fdeaea;border-left:4px solid #e74c3c}.price-diff-row{display:flex;justify-content:space-between;margin-top:6px;font-size:14px}.preview-card{background:#e8f4fd;border-radius:16px;padding:20px;margin-top:24px;border-left:5px solid #3498db}.preview-inner{background:#fff;border-radius:12px;padding:16px}.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:1000}.modal-overlay.show{display:flex}.modal-content{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:80vh;display:flex;flex-direction:column}.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid #ecf0f1}.modal-title{font-size:18px;font-weight:700;color:#2c3e50}.modal-close{cursor:pointer;font-size:24px;color:#7f8c8d;padding:4px}.modal-search{margin:16px 20px;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:15px}.modal-body{flex:1;overflow-y:auto;padding:0 20px 20px}.product-item{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid #ecf0f1;cursor:pointer;border-radius:12px;transition:background .2s}.product-item:hover{background:#f8f9fa}.product-item.owner{background:#f0f8f0}.product-item-info{flex:1;margin-right:12px}.product-item-name{font-weight:700;color:#2c3e50;font-size:15px}.product-item-category{font-size:12px;color:#7f8c8d;margin-top:2px}.product-item-details{display:flex;gap:12px;margin-top:6px;font-size:12px}.product-item-stock{color:#3498db;font-weight:500}.product-item-price{color:#27ae60;font-weight:500}.product-actions{display:flex;gap:8px}.product-action-btn{padding:6px 10px;border-radius:8px;border:none;cursor:pointer;font-size:18px;background:0 0}.owner-badge{background:#d5f4e6;color:#27ae60;font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;margin-left:8px}.no-products{text-align:center;padding:40px;color:#7f8c8d}.loading-spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;padding:20px 16px;padding-top:70px}.mobile-menu-toggle{display:block}}

<script>
const API_BASE_URL='';const categories=['Vyakula','Vinywaji','Matunda','Mboga','Nguo','Viatu','Vifaa vya Nyumbani','Vifaa vya Umeme','Simu na Vifaa','Matibabu','Vifaa vya Usafi','Engine','Sehemu za Gari','Vifaa vya Ujenzi','Vifaa vya Kilimo','Vifaa vya Ofisi','Vitabu na Vifaa vya Kuelimisha','Bidhaa za Watoto','Bidhaa za Urembo','Bidhaa za Kijamii','Michezo na Burudani','Wanyama wa Kufugwa','Vifaa vya Kusafiri','Vifaa vya Teknolojia','Vifaa vya Kudumisha Usalama','Vifaa vya Redio na TV','Vifaa vya Muziki','Vifaa vya Pikipiki','Vifaa vya Baiskeli','Vifaa vya Ushonaji','Vifaa vya Uchoraji','Vifaa vya Ufundi','Vifaa vya Umeme wa Nyumbani','Vifaa vya Jikoni','Vifaa vya Kupimia','Vifaa vya Kukarabati','Vifaa vya Usalama','Vifaa vya Biashara','Vifaa vya Hotelini','Vifaa vya Huduma','Vifaa vya Viwanda','Nyingine'];
const quickFillData={'Vyakula':{name:'Mchele Super',price:'2500',expected_selling_price:'3000',stock:'50'},'Vinywaji':{name:'Maji ya Kunywa',price:'500',expected_selling_price:'700',stock:'100'},'Matunda':{name:'Maembe Dodo',price:'800',expected_selling_price:'1000',stock:'30'},'Mboga':{name:'Nyanya Fresh',price:'1200',expected_selling_price:'1500',stock:'25'},'Nguo':{name:'T-Shirt Rangi',price:'8000',expected_selling_price:'10000',stock:'15'},'Viatu':{name:'Viatu vya Kawaida',price:'25000',expected_selling_price:'30000',stock:'10'}};
let userData=null,token=null,loading=false,existingProducts=[],selectedProduct=null,isOwnerOfSelected=false,modalMode='add',formData={name:'',category:'',price:'',expected_selling_price:'',stock:''},showCustomCategory=false,customCategory='';
function escapeHtml(s){if(!s)return'';return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function formatCurrency(a){return'TZS '+parseInt(a||0).toLocaleString();}
function showAlert(t,m,ok){const o=document.createElement('div');o.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;';const b=document.createElement('div');b.style.cssText='background:#fff;border-radius:28px;width:85%;max-width:340px;padding:24px 20px;text-align:center;';b.innerHTML='<div style="font-size:20px;font-weight:800;margin-bottom:12px;">'+escapeHtml(t)+'</div><div style="font-size:14px;color:#5d6d7e;margin-bottom:24px;white-space:pre-line;">'+escapeHtml(m)+'</div><div style="background:#e74c3c;padding:12px;border-radius:40px;color:#fff;font-weight:700;cursor:pointer;">Sawa</div>';b.querySelector('div:last-child').onclick=()=>{o.remove();if(ok)ok();};o.appendChild(b);document.body.appendChild(o);}
function showConfirm(t,m,fn){const o=document.createElement('div');o.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;';const b=document.createElement('div');b.style.cssText='background:#fff;border-radius:28px;width:85%;max-width:340px;padding:24px 20px;text-align:center;';b.innerHTML='<div style="font-size:18px;font-weight:800;margin-bottom:12px;">'+escapeHtml(t)+'</div><div style="font-size:14px;color:#5d6d7e;margin-bottom:24px;white-space:pre-line;">'+escapeHtml(m)+'</div><div style="display:flex;gap:12px;"><div id="cNo" style="flex:1;background:#95a5a6;padding:12px;border-radius:40px;color:#fff;cursor:pointer;">Ghairi</div><div id="cYes" style="flex:1;background:#e74c3c;padding:12px;border-radius:40px;color:#fff;cursor:pointer;">Thibitisha</div></div>';o.appendChild(b);document.body.appendChild(o);document.getElementById('cYes').onclick=()=>{o.remove();fn();};document.getElementById('cNo').onclick=()=>o.remove();}
function loadUserData(){token=localStorage.getItem('userToken');const u=localStorage.getItem('userData');if(!token||!u){showAlert('Hitilafu','Tafadhali ingia tena',()=>window.location.href='../login.html?role=msimamizi');return false;}userData=JSON.parse(u);const n=userData.full_name||userData.email?.split('@')[0]||'Msimamizi';document.getElementById('userName').innerHTML=escapeHtml(n);const av=document.getElementById('userAvatar');if(userData.business_logo_url)av.innerHTML='<img src="'+escapeHtml(userData.business_logo_url)+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';else av.innerHTML=n.charAt(0).toUpperCase();return true;}
async function fetchExistingProducts(){if(!userData?.business_name)return;try{const r=await fetch(API_BASE_URL+'/api/business/'+encodeURIComponent(userData.business_name)+'/all-products',{headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});if(r.ok)existingProducts=await r.json();}catch(e){}}
function openProductModal(){document.getElementById('productModal').classList.add('show');document.getElementById('productSearch').value='';renderProductList();}
function closeProductModal(){document.getElementById('productModal').classList.remove('show');}
function filterProducts(){renderProductList();}
function renderProductList(){const q=(document.getElementById('productSearch')?.value||'').toLowerCase();const f=existingProducts.filter(p=>p.name.toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q));const b=document.getElementById('productModalBody');if(!f.length){b.innerHTML='<div class="no-products">Hakuna bidhaa zilizopatikana</div>';return;}b.innerHTML=f.map(p=>{const ow=p.seller_id==userData?.id;return '<div class="product-item '+(ow?'owner':'')+'" onclick="selectExistingProduct('+p.id+')"><div class="product-item-info"><div class="product-item-name">'+escapeHtml(p.name)+(ow?'<span class="owner-badge">Yako</span>':'')+'</div><div class="product-item-category">'+escapeHtml(p.category||'N/A')+'</div><div class="product-item-details"><span class="product-item-stock">Hisa: '+(p.stock||0)+'</span><span class="product-item-price">Bei: '+formatCurrency(p.price)+'</span>'+(p.expected_selling_price?'<span style="color:#f39c12">Kuuzia: '+formatCurrency(p.expected_selling_price)+'</span>':'')+'</div></div><div class="product-actions" onclick="event.stopPropagation()"><button class="product-action-btn" onclick="handleAddStock('+p.id+')" style="color:#2ecc71">➕</button>'+(ow?'<button class="product-action-btn" onclick="handleEditProduct('+p.id+')" style="color:#3498db">✏️</button><button class="product-action-btn" onclick="handleDeleteProduct('+p.id+',\''+escapeHtml(p.name).replace(/'/g,"\\'")+'\')" style="color:#e74c3c">🗑️</button>':'')+'</div></div>';}).join('');}
function selectExistingProduct(id){const p=existingProducts.find(x=>x.id===id);if(!p)return;selectedProduct=p;isOwnerOfSelected=p.seller_id==userData?.id;modalMode='add';formData={name:p.name,category:p.category||'',price:p.price?.toString()||'',expected_selling_price:p.expected_selling_price?.toString()||'',stock:''};closeProductModal();renderUI();}
function handleAddStock(id){const p=existingProducts.find(x=>x.id===id);if(!p)return;selectedProduct=p;isOwnerOfSelected=p.seller_id==userData?.id;modalMode='add';formData={name:p.name,category:p.category||'',price:p.price?.toString()||'',expected_selling_price:p.expected_selling_price?.toString()||'',stock:''};closeProductModal();renderUI();}
function handleEditProduct(id){const p=existingProducts.find(x=>x.id===id);if(!p)return;if(p.seller_id!=userData?.id){showAlert('Hitilafu','Huna ruhusa');return;}selectedProduct=p;isOwnerOfSelected=true;modalMode='edit';formData={name:p.name,category:p.category||'',price:p.price?.toString()||'',expected_selling_price:p.expected_selling_price?.toString()||'',stock:p.stock?.toString()||''};closeProductModal();renderUI();}
function handleDeleteProduct(id,nm){const p=existingProducts.find(x=>x.id===id);if(!p||p.seller_id!=userData?.id){showAlert('Hitilafu','Huna ruhusa');return;}showConfirm('Futa Bidhaa','Una uhakika unataka kufuta "'+nm+'"?',async()=>{try{const r=await fetch(API_BASE_URL+'/api/products/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});if(r.ok){showAlert('Mafanikio!','Bidhaa imefutwa');await fetchExistingProducts();resetForm();}else showAlert('Hitilafu','Imeshindwa');}catch(e){showAlert('Hitilafu',e.message);}});}
function clearSelectedProduct(){selectedProduct=null;isOwnerOfSelected=false;modalMode='add';renderUI();}
function isPriceEditable(){if(!selectedProduct)return true;if(modalMode==='edit'&&isOwnerOfSelected)return true;return false;}
function getPriceDiff(){const cp=parseFloat(formData.price||'0'),ep=parseFloat(formData.expected_selling_price||'0');if(cp>0&&ep>0){const d=ep-cp,p=(d/cp)*100;return{diff:d,pct:p,formatted:(d>=0?'+':'')+'TZS '+Math.abs(d).toLocaleString(),pctFormatted:(p>=0?'+':'')+p.toFixed(2)+'%'};}return null;}
function validateForm(){const e=[];if(!formData.name.trim())e.push('Jina linahitajika');if(!formData.category)e.push('Kategoria inahitajika');if(!formData.price||parseFloat(formData.price)<=0)e.push('Bei inahitajika');if(!formData.expected_selling_price||parseFloat(formData.expected_selling_price)<=0)e.push('Bei ya kuuzia inahitajika');if(!formData.stock||parseInt(formData.stock)<0)e.push('Idadi inahitajika');if(parseFloat(formData.expected_selling_price)<parseFloat(formData.price))e.push('Bei ya kuuzia ndogo kuliko bei ya sasa');return e;}
async function handleSubmit(){const errs=validateForm();if(errs.length){showAlert('Hitilafu',errs.join('\n'));return;}if(loading)return;loading=true;renderUI();try{const pd={name:formData.name.trim(),category:formData.category,price:parseFloat(formData.price),stock:parseInt(formData.stock),expected_selling_price:parseFloat(formData.expected_selling_price)};const h={'Content-Type':'application/json','Authorization':'Bearer '+token};if(selectedProduct&&modalMode==='add'){const qty=parseInt(formData.stock||'0');if(qty<=0){showAlert('Hitilafu','Weka idadi');loading=false;renderUI();return;}const ns=parseInt(selectedProduct.stock||'0')+qty;const r=await fetch(API_BASE_URL+'/api/products/'+selectedProduct.id,{method:'PUT',headers:h,body:JSON.stringify({name:selectedProduct.name,category:selectedProduct.category,price:parseFloat(selectedProduct.price),stock:ns,expected_selling_price:parseFloat(selectedProduct.expected_selling_price||selectedProduct.price)})});if(r.ok){showAlert('Mafanikio!','Hisa imeongezwa: '+selectedProduct.name+'\nJumla: '+ns);await fetchExistingProducts();resetForm();}else showAlert('Hitilafu','Imeshindwa');loading=false;renderUI();return;}if(selectedProduct&&modalMode==='edit'){const r=await fetch(API_BASE_URL+'/api/products/'+selectedProduct.id,{method:'PUT',headers:h,body:JSON.stringify(pd)});if(r.ok){showAlert('Mafanikio!','Bidhaa imesasishwa');await fetchExistingProducts();resetForm();}else showAlert('Hitilafu','Imeshindwa');loading=false;renderUI();return;}const ex=existingProducts.find(p=>p.name.toLowerCase()===formData.name.toLowerCase().trim());if(ex&&ex.seller_id==userData?.id){const ns=parseInt(ex.stock||'0')+parseInt(formData.stock);const r=await fetch(API_BASE_URL+'/api/products/'+ex.id,{method:'PUT',headers:h,body:JSON.stringify({...pd,stock:ns})});if(r.ok){showAlert('Mafanikio!','Hisa jumla: '+ns);await fetchExistingProducts();resetForm();}else showAlert('Hitilafu','Imeshindwa');loading=false;renderUI();return;}const r=await fetch(API_BASE_URL+'/api/products',{method:'POST',headers:h,body:JSON.stringify(pd)});const txt=await r.text();if(r.ok){showAlert('Mafanikio!','Bidhaa imeongezwa\nBei: '+formatCurrency(formData.price)+'\nKuuzia: '+formatCurrency(formData.expected_selling_price)+'\nHisa: '+formData.stock);await fetchExistingProducts();resetForm();}else if(r.status===403){showAlert('Bidhaa Ipopo','Bidhaa "'+formData.name+'" tayariipo.\nKuongeza kama mpya?',async()=>{const r2=await fetch(API_BASE_URL+'/api/products',{method:'POST',headers:h,body:JSON.stringify(pd)});if(r2.ok){showAlert('Mafanikio!','Bidhaa mpya imeongezwa');await fetchExistingProducts();resetForm();}else showAlert('Hitilafu','Imeshindwa');});}else showAlert('Hitilafu',txt||'Imeshindwa');}catch(e){showAlert('Hitilafu',e.message);}loading=false;renderUI();}
function resetForm(){formData={name:'',category:'',price:'',expected_selling_price:'',stock:''};customCategory='';showCustomCategory=false;selectedProduct=null;isOwnerOfSelected=false;modalMode='add';renderUI();}
function renderUI(){const c=document.getElementById('bidhaaContainer');const pe=isPriceEditable();const pd=getPriceDiff();const iv=formData.name&&formData.category&&formData.price&&formData.expected_selling_price&&formData.stock;const sc=modalMode==='edit'?'update':(selectedProduct&&modalMode==='add'?'addstock':'add');const sl=modalMode==='edit'?'🔄 SASISHA BIDHAA':(selectedProduct&&modalMode==='add'?'➕ ONGEZA HISA':'➕ ONGEZA BIDHAA MPYA');const ch=categories.map(cat=>'<div class="category-chip '+(formData.category===cat?'selected':'')+'" data-cat="'+cat+'">'+escapeHtml(cat)+'</div>').join('');c.innerHTML='<div class="form-card"><h2 style="color:#2c3e50;margin-bottom:4px">'+(modalMode==='edit'?'✏️ Hariri Bidhaa':'➕ Ongeza Bidhaa Mpya')+'</h2><p style="color:#7f8c8d;margin-bottom:20px">'+(modalMode==='edit'?'Sasisha taarifa':'Jaza taarifa za bidhaa')+'</p><div class="existing-btn" onclick="openProductModal()"><span style="font-size:28px">📋</span><div style="flex:1"><div style="font-weight:700;color:#2c3e50">Bidhaa Zilizopo</div><div style="font-size:13px;color:#7f8c8d">Chagua bidhaa ('+existingProducts.length+' bidhaa)</div></div><span style="color:#95a5a6;font-size:20px">›</span></div>'+(selectedProduct?'<div class="selected-banner '+(isOwnerOfSelected?'':'non-owner')+'"><div class="selected-banner-header"><div class="selected-banner-title">'+(modalMode==='edit'?'✏️ Unahariri':'📦 Ongeza Hisa')+': '+escapeHtml(selectedProduct.name)+'</div><div class="selected-banner-close" onclick="clearSelectedProduct()">✖</div></div><div style="font-size:12px;color:#7f8c8d">Kategoria: '+escapeHtml(selectedProduct.category||'N/A')+' • Hisa: '+(selectedProduct.stock||0)+' • Bei: '+formatCurrency(selectedProduct.price)+(selectedProduct.expected_selling_price?' • Kuuzia: '+formatCurrency(selectedProduct.expected_selling_price):'')+'</div></div>':'')+'<div class="input-group"><label class="label">Jina la Bidhaa *</label><input type="text" id="fName" placeholder="Weka jina kamili" value="'+escapeHtml(formData.name)+'" '+(selectedProduct&&modalMode==='add'?'disabled':'')+'></div><div class="input-group"><label class="label">Kategoria *</label><div class="categories-scroll">'+ch+'</div><div id="customCatWrap" style="margin-top:12px;padding:12px;background:#e8f4fd;border-radius:14px;border-left:4px solid #3498db;display:'+(showCustomCategory?'block':'none')+'"><input type="text" id="fCustomCat" placeholder="Andika kategoria yako" value="'+escapeHtml(customCategory)+'"></div></div><div class="input-group"><label class="label">Bei ya Sasa *</label><div class="price-container"><input type="number" id="fPrice" placeholder="Bei ya sasa" value="'+formData.price+'" '+(!pe?'disabled':'')+'><div class="price-preview" id="pp1" style="display:'+(formData.price?'block':'none')+'"><small>TZS</small> <strong id="ppv1">'+(formData.price?parseInt(formData.price).toLocaleString():'')+'</strong></div></div>'+(!pe&&selectedProduct?'<div style="font-size:12px;color:#e74c3c;margin-top:4px;font-style:italic">⚠️ Bei haibadilishi unapoongeza hisa</div>':'')+'</div><div class="input-group"><label class="label">Bei ya Kuuzia *</label><div class="price-container"><input type="number" id="fExpPrice" placeholder="Bei unayotaka kauzia" value="'+formData.expected_selling_price+'" '+(!pe?'disabled':'')+'><div class="price-preview" id="pp2" style="display:'+(formData.expected_selling_price?'block':'none')+'"><small>TZS</small> <strong id="ppv2">'+(formData.expected_selling_price?parseInt(formData.expected_selling_price).toLocaleString():'')+'</strong></div></div></div>'+(pd?'<div class="price-diff '+(pd.diff>=0?'positive':'negative')+'"><div style="font-weight:700;color:#2c3e50">'+(pd.diff>=0?'📈 Faida':'⚠️ Hasara')+'</div><div class="price-diff-row"><span>Faida/bidhaa:</span><strong style="color:'+(pd.diff>=0?'#27ae60':'#e74c3c')+'">'+pd.formatted+'</strong></div><div class="price-diff-row"><span>Asilimia:</span><strong style="color:'+(pd.diff>=0?'#27ae60':'#e74c3c')+'">'+pd.pctFormatted+'</strong></div></div>':'')+'<div class="input-group"><label class="label">'+(modalMode==='edit'?'Idadi Mpya':(selectedProduct&&modalMode==='add'?'Idadi ya Kuongeza':'Idadi ya Bidhaa'))+' *</label><input type="number" id="fStock" placeholder="'+(selectedProduct&&modalMode==='add'?'Weka idadi ya kuongeza':'Weka idadi')+'" value="'+formData.stock+'">'+(selectedProduct&&modalMode==='add'?'<div style="font-size:13px;color:#27ae60;margin-top:6px">Sasa: '+(selectedProduct.stock||0)+' → Jumla: '+(parseInt(selectedProduct.stock||0)+parseInt(formData.stock||0))+'</div>':'')+'</div><button id="submitBtn" class="submit-btn '+sc+' '+(!iv?'disabled':'')+'" '+(!iv?'disabled':'')+'>'+(loading?'<div class="loading-spinner"></div>':sl)+'</button></div><div id="previewArea"></div>';
document.getElementById('submitBtn')?.addEventListener('click',handleSubmit);document.getElementById('fName')?.addEventListener('input',e=>{formData.name=e.target.value;updateDynamic();});document.getElementById('fPrice')?.addEventListener('input',e=>{formData.price=e.target.value.replace(/[^0-9]/g,'');updateDynamic();});document.getElementById('fExpPrice')?.addEventListener('input',e=>{formData.expected_selling_price=e.target.value.replace(/[^0-9]/g,'');updateDynamic();});document.getElementById('fStock')?.addEventListener('input',e=>{formData.stock=e.target.value.replace(/[^0-9]/g,'');updateDynamic();});document.getElementById('fCustomCat')?.addEventListener('input',e=>{customCategory=e.target.value;formData.category=customCategory;updateDynamic();});document.querySelectorAll('.category-chip').forEach(el=>{el.addEventListener('click',()=>{const cat=el.getAttribute('data-cat');if(cat==='Nyingine'){showCustomCategory=true;formData.category='';document.getElementById('customCatWrap').style.display='block';}else{showCustomCategory=false;formData.category=cat;document.getElementById('customCatWrap').style.display='none';const q=quickFillData[cat];if(q&&!formData.name){formData.name=q.name;formData.price=q.price;formData.expected_selling_price=q.expected_selling_price;formData.stock=q.stock;const fn=document.getElementById('fName'),fp=document.getElementById('fPrice'),fe=document.getElementById('fExpPrice'),fs=document.getElementById('fStock');if(fn)fn.value=q.name;if(fp)fp.value=q.price;if(fe)fe.value=q.expected_selling_price;if(fs)fs.value=q.stock;}}updateDynamic();});});updateDynamic();}
function updateDynamic(){document.querySelectorAll('.category-chip').forEach(el=>{el.classList.toggle('selected',formData.category===el.getAttribute('data-cat'));});const p1=document.getElementById('pp1'),v1=document.getElementById('ppv1');if(p1&&v1){p1.style.display=formData.price?'block':'none';v1.textContent=formData.price?parseInt(formData.price).toLocaleString():'';}const p2=document.getElementById('pp2'),v2=document.getElementById('ppv2');if(p2&&v2){p2.style.display=formData.expected_selling_price?'block':'none';v2.textContent=formData.expected_selling_price?parseInt(formData.expected_selling_price).toLocaleString():'';}const iv=formData.name&&formData.category&&formData.price&&formData.expected_selling_price&&formData.stock;const sb=document.getElementById('submitBtn');if(sb){sb.disabled=!iv;sb.classList.toggle('disabled',!iv);}const pa=document.getElementById('previewArea');if(pa&&(formData.name||formData.price||formData.expected_selling_price)){const d=getPriceDiff();pa.innerHTML='<div class="preview-card"><div class="preview-inner"><div style="font-weight:700;margin-bottom:12px">📋 Hakiki:</div><div><strong>'+escapeHtml(formData.name||'Jina')+'</strong></div><div style="font-size:13px;color:#7f8c8d">Kategoria: '+escapeHtml(formData.category||'N/A')+'</div><div style="display:flex;justify-content:space-between;margin-top:10px"><div>Bei: <strong style="color:#3498db">'+formatCurrency(formData.price)+'</strong></div><div>Kuuzia: <strong style="color:#27ae60">'+formatCurrency(formData.expected_selling_price)+'</strong></div></div>'+(d?'<div style="margin-top:8px;font-size:13px">Faida: <strong style="color:'+(d.diff>=0?'#27ae60':'#e74c3c')+'">'+d.formatted+' ('+d.pctFormatted+')</strong></div>':'')+'<div style="margin-top:8px">Idadi: '+(formData.stock||0)+'</div></div></div>';}else if(pa)pa.innerHTML='';}
function setupSidebar(){document.getElementById('mobileMenuToggle')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('logoutBtn')?.addEventListener('click',()=>{localStorage.clear();window.location.href='../login.html?role=msimamizi';});}
async function init(){setupSidebar();if(!loadUserData())return;await fetchExistingProducts();renderUI();}
init();
</script>
