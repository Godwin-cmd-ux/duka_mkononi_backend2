<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Rejea ya Biashara - Dukamkononi Msimamizi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8f9fa;
        }

        /* Layout */
        .msimamizi-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background-color: #ffffff;
            border-right: 1px solid #ecf0f1;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s ease;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.05);
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid #ecf0f1;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-text h2 {
            font-size: 18px;
            font-weight: 800;
            color: #2c3e50;
        }

        .logo-text p {
            font-size: 12px;
            color: #7f8c8d;
        }

        .nav-items {
            flex: 1;
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            margin-bottom: 8px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #5d6d7e;
            font-weight: 500;
            text-decoration: none;
        }

        .nav-item:hover {
            background-color: #fdeaea;
        }

        .nav-item.active {
            background-color: #fdeaea;
            color: #e74c3c;
        }

        .nav-icon { font-size: 20px; width: 24px; }
        .nav-label { font-size: 15px; font-weight: 600; }

        .sidebar-footer {
            padding: 20px 16px;
            border-top: 1px solid #ecf0f1;
            margin-top: auto;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background-color: #fdeaea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e74c3c;
            font-weight: bold;
            font-size: 18px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 700;
            color: #2c3e50;
        }

        .user-role {
            font-size: 12px;
            color: #e74c3c;
            font-weight: 600;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background-color: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            color: #e74c3c;
            font-weight: 600;
            font-size: 14px;
        }

        .main-content {
            flex: 1;
            margin-left: 280px;
            min-height: 100vh;
            background-color: #f8f9fa;
            padding: 20px 24px 40px;
        }

        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            background: white;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Preview Screen Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            color: #2c3e50;
        }

        .business-name {
            font-size: 16px;
            color: #3498db;
            margin-top: 4px;
        }

        .business-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }

        .stat-badge {
            background: #f8f9fa;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .refresh-btn {
            padding: 8px;
            cursor: pointer;
        }

        .info-card {
            background: #e8f4fd;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
        }

        /* Tabs */
        .tabs-container {
            background: white;
            border-radius: 12px;
            margin-bottom: 16px;
            padding: 4px;
            display: flex;
        }

        .tab-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .tab-btn.active {
            background: #3498db10;
            color: #3498db;
            border: 1px solid #3498db30;
        }

        /* Day Cards */
        .day-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .date-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .date-badge {
            background: #3498db;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
        }

        .summary-grid {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .summary-box {
            flex: 1;
            text-align: center;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
        }

        .summary-number {
            font-size: 18px;
            font-weight: 700;
        }

        .net-profit-row {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            justify-content: space-between;
        }

        .modal-body {
            padding: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 12px;
        }

        .expense-item, .sale-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px 16px; padding-top: 70px; }
            .mobile-menu-toggle { display: block; }
        }
    </style>
</head>
<body>
    <div class="mobile-menu-toggle" id="mobileMenuToggle">☰</div>

    <div class="msimamizi-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <div class="logo-icon">D</div>
                    <div class="logo-text">
                        <h2>DukaMkononi</h2>
                        <p>Msimamizi Portal</p>
                    </div>
                </div>
            </div>
            <div class="nav-items">
                <a href="index.html" class="nav-item">
                    <div class="nav-icon">🏠</div>
                    <span class="nav-label">Nyumbani</span>
                </a>
                <a href="ripoti.html" class="nav-item">
                    <div class="nav-icon">📊</div>
                    <span class="nav-label">Ripoti</span>
                </a>
                <a href="preview.html" class="nav-item active">
                    <div class="nav-icon">📅</div>
                    <span class="nav-label">Rejea</span>
                </a>
                <a href="bidhaa-mpya.html" class="nav-item">
                    <div class="nav-icon">➕</div>
                    <span class="nav-label">Bidhaa Mpya</span>
                </a>
                <a href="tangaza.html" class="nav-item">
                    <div class="nav-icon">📢</div>
                    <span class="nav-label">Tangaza</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">M</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Msimamizi</div>
                        <div class="user-role">Msimamizi</div>
                    </div>
                </div>
                <div class="logout-btn" id="logoutBtn">🚪 Ondoka</div>
            </div>
        </aside>

        <main class="main-content" id="mainContent">
            <div id="previewContainer">Loading...</div>
        </main>
    </div>

    <div id="dayModal" class="modal-overlay">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        const API_BASE_URL = '';
        
        let userData = { businessName: '', businessLocation: '', userId: '', userRole: '' };
        let dailySummaries = [];
        let businessEvents = [];
        let businessStats = { totalSellers: 0, totalProducts: 0, totalSalesAmount: 0, totalProfit: 0, totalNetProfit: 0 };
        let loading = true;
        let activeTab = 'days';

        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

        function formatCurrency(amount) { return `TSh ${(amount || 0).toLocaleString()}`; }

        function formatDate(dateStr) {
            try {
                return new Date(dateStr).toLocaleDateString('sw-TZ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            } catch { return dateStr; }
        }

        function getShortDate(dateStr) {
            try {
                return new Date(dateStr).toLocaleDateString('sw-TZ', { weekday: 'short', month: 'short', day: 'numeric' });
            } catch { return dateStr; }
        }

        function showAlert(title, message) {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:2000;';
            const box = document.createElement('div');
            box.style.cssText = 'background:white;border-radius:28px;width:85%;max-width:320px;padding:24px;text-align:center;';
            box.innerHTML = `<div style="font-size:20px;font-weight:800;margin-bottom:12px;">${escapeHtml(title)}</div>
                <div style="font-size:14px;color:#5d6d7e;margin-bottom:24px;">${escapeHtml(message)}</div>
                <div style="background:#e74c3c;padding:12px;border-radius:40px;color:white;cursor:pointer;">Sawa</div>`;
            box.querySelector('div:last-child').onclick = () => overlay.remove();
            overlay.appendChild(box);
            document.body.appendChild(overlay);
        }

        async function loadUserData() {
            const token = localStorage.getItem('userToken');
            const userStr = localStorage.getItem('userData');
            if (!token || !userStr) {
                showAlert('Hitilafu', 'Tafadhali ingia tena');
                setTimeout(() => window.location.href = '../login.html?role=msimamizi', 1500);
                return false;
            }
            const user = JSON.parse(userStr);
            userData = {
                businessName: user.businessName || user.business_name || 'Biashara Kuu',
                businessLocation: user.businessLocation || user.business_location || 'Makao Makuu',
                userId: user.id || '',
                userRole: user.role || ''
            };
            document.getElementById('userName').innerHTML = escapeHtml(user.full_name || user.email?.split('@')[0] || 'Msimamizi');
            document.getElementById('userAvatar').innerHTML = (user.full_name || user.email?.charAt(0) || 'M').charAt(0).toUpperCase();
            return token;
        }

        async function fetchData(token) {
            try {
                // Fetch sellers
                let sellers = [];
                const sellersRes = await fetch(`${API_BASE_URL}/api/admin/users?business=${encodeURIComponent(userData.businessName)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (sellersRes.ok) {
                    const data = await sellersRes.json();
                    const users = data.users || (Array.isArray(data) ? data : []);
                    sellers = users.filter(u => u.role === 'seller' && u.business_name === userData.businessName && u.status === 'approved');
                }

                // Fetch products
                let products = [];
                const productsRes = await fetch(`${API_BASE_URL}/api/admin/products`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (productsRes.ok) {
                    const data = await productsRes.json();
                    const prodArray = data.products || (Array.isArray(data) ? data : []);
                    products = prodArray.filter(p => sellers.some(s => s.id === p.seller_id));
                }

                // Fetch sales
                let sales = [];
                const salesRes = await fetch(`${API_BASE_URL}/api/admin/sales`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (salesRes.ok) {
                    const data = await salesRes.json();
                    const salesArray = data.sales || (Array.isArray(data) ? data : []);
                    
                    for (const sale of salesArray) {
                        const seller = sellers.find(s => s.id === sale.seller_id);
                        if (seller && seller.business_name === userData.businessName) {
                            if (sale.sale_items && sale.sale_items.length) {
                                for (const item of sale.sale_items) {
                                    const product = products.find(p => p.id === item.product_id);
                                    sales.push({
                                        id: sale.id,
                                        product_name: product?.name || item.products?.name || 'Bidhaa',
                                        quantity: item.quantity || 1,
                                        unit_price: item.unit_price || 0,
                                        total_amount: item.total_price || (item.unit_price * item.quantity),
                                        sale_date: sale.sale_date?.split('T')[0] || new Date().toISOString().split('T')[0],
                                        customer_name: sale.customers?.name || 'Mteja',
                                        seller_name: seller.full_name || seller.email,
                                        cost_price: product?.cost_price || product?.price || 0
                                    });
                                }
                            } else {
                                sales.push({
                                    id: sale.id,
                                    product_name: 'Bidhaa',
                                    quantity: 1,
                                    unit_price: sale.total_amount || 0,
                                    total_amount: sale.total_amount || 0,
                                    sale_date: sale.sale_date?.split('T')[0] || new Date().toISOString().split('T')[0],
                                    customer_name: sale.customers?.name || 'Mteja',
                                    seller_name: seller.full_name || seller.email,
                                    cost_price: 0
                                });
                            }
                        }
                    }
                }

                // Get unique dates
                const dates = [...new Set(sales.map(s => s.sale_date))];
                
                // Fetch expenses for each date
                const expensesByDate = {};
                for (const date of dates) {
                    try {
                        const expRes = await fetch(`${API_BASE_URL}/api/office-expenses/range?start_date=${date}&end_date=${date}`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (expRes.ok) {
                            const expData = await expRes.json();
                            if (expData.success && expData.expenses) {
                                expensesByDate[date] = expData.expenses.filter(e => e.expense_date?.split('T')[0] === date);
                            } else {
                                expensesByDate[date] = [];
                            }
                        } else {
                            expensesByDate[date] = [];
                        }
                    } catch { expensesByDate[date] = []; }
                }

                // Process daily summaries
                const salesByDate = {};
                sales.forEach(sale => {
                    if (!salesByDate[sale.sale_date]) salesByDate[sale.sale_date] = [];
                    salesByDate[sale.sale_date].push(sale);
                });

                const summaries = Object.keys(salesByDate).map(date => {
                    const daySales = salesByDate[date];
                    const dayExpenses = expensesByDate[date] || [];
                    const totalSales = daySales.reduce((s, sale) => s + (sale.total_amount || 0), 0);
                    const totalProducts = daySales.reduce((s, sale) => s + (sale.quantity || 0), 0);
                    const totalProfit = daySales.reduce((s, sale) => {
                        const profit = (sale.unit_price - (sale.cost_price || 0)) * sale.quantity;
                        return s + Math.max(0, profit);
                    }, 0);
                    const totalExpenses = dayExpenses.reduce((s, e) => s + (e.amount || 0), 0);
                    const netProfit = totalProfit - totalExpenses;
                    const customers = [...new Set(daySales.map(s => s.customer_name))];
                    const daySellers = [...new Map(daySales.map(s => [s.seller_name, { name: s.seller_name }])).values()];
                    
                    return { date, totalSales, totalProducts, totalProfit, totalExpenses, netProfit, sales: daySales, customers, sellers: daySellers, expenses: dayExpenses };
                });
                
                summaries.sort((a,b) => new Date(b.date) - new Date(a.date));
                dailySummaries = summaries;

                // Build events
                const events = [];
                sales.slice(0, 20).forEach(sale => {
                    events.push({ id: sale.id, type: 'sale', title: 'Mauzo', description: `${sale.quantity} ${sale.product_name} imeuza kwa ${sale.customer_name}`, amount: sale.total_amount, seller_name: sale.seller_name, customer_name: sale.customer_name, product_name: sale.product_name, event_date: sale.sale_date });
                });
                products.slice(0, 10).forEach(product => {
                    events.push({ id: product.id + 1000, type: 'product_added', title: 'Bidhaa Mpya', description: `Bidhaa ${product.name} imeongezwa`, amount: product.price, product_name: product.name, event_date: product.created_at?.split('T')[0] || new Date().toISOString().split('T')[0] });
                });
                products.filter(p => p.stock < 5).forEach(product => {
                    events.push({ id: product.id + 2000, type: 'low_stock', title: 'Stock Inakaribia Kuisha', description: `Bidhaa ${product.name} ina stock ${product.stock} pekee`, product_name: product.name, event_date: new Date().toISOString().split('T')[0] });
                });
                events.sort((a,b) => new Date(b.event_date) - new Date(a.event_date));
                businessEvents = events;

                // Stats
                const totalSalesAmount = sales.reduce((s, sale) => s + (sale.total_amount || 0), 0);
                const totalProfit = sales.reduce((s, sale) => s + Math.max(0, (sale.unit_price - (sale.cost_price || 0)) * sale.quantity), 0);
                let totalExpensesAll = 0;
                Object.values(expensesByDate).forEach(dayExps => dayExps.forEach(e => totalExpensesAll += e.amount));
                businessStats = {
                    totalSellers: sellers.length,
                    totalProducts: products.length,
                    totalSalesAmount,
                    totalProfit,
                    totalNetProfit: totalProfit - totalExpensesAll
                };

            } catch (error) {
                console.error('Fetch error:', error);
            }
        }

        function renderDaysTab() {
            if (dailySummaries.length === 0) {
                return `<div style="text-align:center;padding:40px;background:white;border-radius:16px;">
                    <div style="font-size:48px;">📊</div>
                    <div style="margin-top:16px;font-weight:600;">Hakuna mauzo ya biashara bado</div>
                    <div style="font-size:13px;color:#95a5a6;margin-top:8px;">Biashara "${escapeHtml(userData.businessName)}" haina mauzo yaliyorekodiwa.</div>
                </div>`;
            }
            
            return dailySummaries.map(day => `
                <div class="day-card" onclick="window.showDayModal('${day.date}')">
                    <div class="date-header">
                        <span class="date-badge">📅 ${getShortDate(day.date)}</span>
                        <span style="font-size:12px;color:#7f8c8d;">${day.sales.length} mauzo</span>
                    </div>
                    <div class="summary-grid">
                        <div class="summary-box"><div>📦</div><div class="summary-number">${day.totalProducts}</div><div>Bidhaa</div></div>
                        <div class="summary-box"><div>💰</div><div class="summary-number">${formatCurrency(day.totalSales)}</div><div>Mauzo</div></div>
                        <div class="summary-box"><div>📈</div><div class="summary-number">${formatCurrency(day.totalProfit)}</div><div>Faida</div></div>
                    </div>
                    <div class="net-profit-row">
                        <span>📊 Faida Halisi:</span>
                        <strong style="color:${day.netProfit >= 0 ? '#27ae60' : '#e74c3c'}">${formatCurrency(day.netProfit)}</strong>
                        ${day.expenses.length ? `<span style="font-size:11px;color:#e67e22;">(Matumizi: ${formatCurrency(day.totalExpenses)})</span>` : ''}
                    </div>
                    <div style="font-size:12px;color:#3498db;">👥 Wateja: ${day.customers.slice(0,3).join(', ')}${day.customers.length > 3 ? '...' : ''}</div>
                    <div style="font-size:11px;color:#9b59b6;margin-top:6px;">Bonyeza kwa muhtasari kamili →</div>
                </div>
            `).join('');
        }

        function renderEventsTab() {
            if (businessEvents.length === 0) {
                return `<div style="text-align:center;padding:40px;background:white;border-radius:16px;">
                    <div style="font-size:48px;">🔔</div>
                    <div style="margin-top:16px;font-weight:600;">Hakuna matukio bado</div>
                </div>`;
            }
            
            return businessEvents.map(event => `
                <div style="background:white;border-radius:12px;padding:16px;margin-bottom:12px;">
                    <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                        <div style="display:flex;gap:8px;align-items:center;">
                            <span style="font-size:20px;">${event.type === 'sale' ? '💰' : event.type === 'product_added' ? '📦' : '⚠️'}</span>
                            <div><strong>${event.title}</strong><div style="font-size:11px;color:#7f8c8d;">${event.event_date}</div></div>
                        </div>
                        ${event.amount ? `<strong style="color:#27ae60;">${formatCurrency(event.amount)}</strong>` : ''}
                    </div>
                    <div style="font-size:14px;color:#2c3e50;">${event.description}</div>
                    ${event.seller_name ? `<div style="font-size:11px;color:#7f8c8d;margin-top:8px;">👤 ${event.seller_name}</div>` : ''}
                </div>
            `).join('');
        }

        function render() {
            const container = document.getElementById('previewContainer');
            container.innerHTML = `
                <div class="header">
                    <div>
                        <h1 class="title">Rejea ya Biashara</h1>
                        <div class="business-name">🏢 ${escapeHtml(userData.businessName)}</div>
                        <div class="business-stats">
                            <span class="stat-badge">👥 ${businessStats.totalSellers} wauzaji</span>
                            <span class="stat-badge">📦 ${businessStats.totalProducts} bidhaa</span>
                            <span class="stat-badge">💰 ${formatCurrency(businessStats.totalSalesAmount)} mauzo</span>
                            <span class="stat-badge">📈 ${formatCurrency(businessStats.totalProfit)} faida</span>
                            <span class="stat-badge">📊 ${formatCurrency(businessStats.totalNetProfit)} halisi</span>
                        </div>
                    </div>
                    <div class="refresh-btn" id="refreshBtn">🔄</div>
                </div>
                <div class="info-card">
                    <div style="font-weight:600;margin-bottom:6px;">📋 Muhtasari wa Biashara</div>
                    <div style="font-size:13px;">Data ya biashara nzima "${escapeHtml(userData.businessName)}". Faida halisi ni baada ya kutoa matumizi ya ofisi.</div>
                </div>
                <div class="tabs-container">
                    <div class="tab-btn ${activeTab === 'days' ? 'active' : ''}" onclick="window.setTab('days')">📅 Siku Zangu</div>
                    <div class="tab-btn ${activeTab === 'events' ? 'active' : ''}" onclick="window.setTab('events')">🔔 Taarifa (${businessEvents.length})</div>
                </div>
                <div id="tabContent">${activeTab === 'days' ? renderDaysTab() : renderEventsTab()}</div>
            `;
            
            document.getElementById('refreshBtn')?.addEventListener('click', () => { location.reload(); });
        }

        window.setTab = (tab) => {
            activeTab = tab;
            render();
        };

        window.showDayModal = (date) => {
            const day = dailySummaries.find(d => d.date === date);
            if (!day) return;
            
            const modal = document.getElementById('dayModal');
            const modalContent = document.getElementById('modalContent');
            
            modalContent.innerHTML = `
                <div class="modal-header">
                    <div><strong>📅 ${formatDate(day.date)}</strong><div style="font-size:12px;color:#3498db;">${escapeHtml(userData.businessName)}</div></div>
                    <span style="cursor:pointer;font-size:24px;" onclick="document.getElementById('dayModal').style.display='none'">✖</span>
                </div>
                <div class="modal-body">
                    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;">
                        <div class="stat-card"><div>📦</div><div style="font-size:20px;font-weight:700;">${day.totalProducts}</div><div>Bidhaa</div></div>
                        <div class="stat-card"><div>💰</div><div style="font-size:20px;font-weight:700;">${formatCurrency(day.totalSales)}</div><div>Mauzo</div></div>
                        <div class="stat-card"><div>📈</div><div style="font-size:20px;font-weight:700;">${formatCurrency(day.totalProfit)}</div><div>Faida Ghafi</div></div>
                        <div class="stat-card"><div>📊</div><div style="font-size:20px;font-weight:700;color:${day.netProfit >= 0 ? '#27ae60' : '#e74c3c'}">${formatCurrency(day.netProfit)}</div><div>Faida Halisi</div></div>
                    </div>
                    
                    ${day.expenses.length ? `
                        <div style="margin-bottom:16px;"><strong>💰 Matumizi ya Ofisi</strong></div>
                        ${day.expenses.map(e => `<div class="expense-item"><span>${escapeHtml(e.category)}: ${escapeHtml(e.description)}</span><strong>${formatCurrency(e.amount)}</strong></div>`).join('')}
                    ` : ''}
                    
                    <div style="margin-bottom:16px;"><strong>👥 Wateja (${day.customers.length})</strong></div>
                    <div style="background:#f8f9fa;padding:12px;border-radius:12px;margin-bottom:16px;">
                        ${day.customers.map(c => `<div>• ${escapeHtml(c)}</div>`).join('')}
                    </div>
                    
                    <div style="margin-bottom:16px;"><strong>📋 Mauzo ya Siku Hii</strong></div>
                    ${day.sales.slice(0,5).map(sale => `
                        <div class="sale-item">
                            <div><strong>${escapeHtml(sale.product_name)}</strong><br><span style="font-size:11px;color:#7f8c8d;">${escapeHtml(sale.customer_name)}</span></div>
                            <div style="text-align:right;"><strong>${formatCurrency(sale.total_amount)}</strong><br><span style="font-size:11px;">${sale.quantity} × ${formatCurrency(sale.unit_price)}</span></div>
                        </div>
                    `).join('')}
                    
                    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #ecf0f1;">
                        <div style="display:flex;justify-content:space-between;"><span>Jumla ya Bidhaa:</span><strong>${day.totalProducts}</strong></div>
                        <div style="display:flex;justify-content:space-between;"><span>Jumla ya Mauzo:</span><strong>${formatCurrency(day.totalSales)}</strong></div>
                        <div style="display:flex;justify-content:space-between;"><span>Faida Ghafi:</span><strong>${formatCurrency(day.totalProfit)}</strong></div>
                        <div style="display:flex;justify-content:space-between;"><span>Jumla ya Matumizi:</span><strong>${formatCurrency(day.totalExpenses)}</strong></div>
                        <div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:2px solid #3498db;"><span>Faida Halisi:</span><strong style="color:${day.netProfit >= 0 ? '#27ae60' : '#e74c3c'}">${formatCurrency(day.netProfit)}</strong></div>
                    </div>
                </div>
            `;
            modal.style.display = 'flex';
        };

        async function init() {
            const token = await loadUserData();
            if (!token) return;
            
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = '../login.html?role=msimamizi';
            });
            
            const toggle = document.getElementById('mobileMenuToggle');
            const sidebar = document.getElementById('sidebar');
            toggle.addEventListener('click', () => sidebar.classList.toggle('open'));
            
            await fetchData(token);
            loading = false;
            render();
        }
        
        init();
    </script>
</body>
</html>
