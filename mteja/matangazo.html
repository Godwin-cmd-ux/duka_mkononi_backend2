<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Matangazo - Dukamkononi Mteja</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        /* Main layout wrapper - sidebar + content */
        .mteja-layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR - Persistent navigation */
        .sidebar {
            width: 280px;
            background-color: #ffffff;
            border-right: 1px solid #ecf0f1;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s ease;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.05);
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid #ecf0f1;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-text h2 {
            font-size: 18px;
            font-weight: 800;
            color: #2c3e50;
        }

        .logo-text p {
            font-size: 12px;
            color: #7f8c8d;
        }

        .nav-items {
            flex: 1;
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            margin-bottom: 8px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #5d6d7e;
            font-weight: 500;
            text-decoration: none;
        }

        .nav-item:hover {
            background-color: #ede7f6;
        }

        .nav-item.active {
            background-color: #ede7f6;
            color: #667eea;
        }

        .nav-icon {
            font-size: 22px;
            width: 28px;
        }

        .nav-label {
            font-size: 15px;
            font-weight: 600;
        }

        .sidebar-footer {
            padding: 20px 16px;
            border-top: 1px solid #ecf0f1;
            margin-top: auto;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background-color: #ede7f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-weight: bold;
            font-size: 18px;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            font-weight: 700;
            color: #2c3e50;
        }

        .user-role {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background-color: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e74c3c;
            font-weight: 600;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: #fdeaea;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            margin-left: 280px;
            min-height: 100vh;
            background-color: #f8f9fa;
            padding: 20px 24px 40px;
        }

        /* Mobile menu toggle */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        /* Matangazo specific styles */
        .page-container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .list-header {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .screen-title {
            font-size: 28px;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .screen-subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 12px;
        }

        .info-text {
            font-size: 13px;
            color: #2c3e50;
            background: #e8f4fd;
            padding: 10px;
            border-radius: 10px;
            margin: 8px 0;
            font-weight: 600;
        }

        .login-warning {
            background: #fff3cd;
            padding: 10px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
            margin-top: 8px;
        }

        .login-warning-text {
            font-size: 12px;
            color: #856404;
        }

        /* Post Card */
        .post-card {
            background: white;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
        }

        .business-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .business-details {
            flex: 1;
        }

        .business-name {
            font-size: 16px;
            font-weight: 700;
            color: #2c3e50;
        }

        .owner-name {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 2px;
        }

        .order-btn {
            background: #27ae60;
            padding: 8px 20px;
            border-radius: 10px;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        /* Media */
        .media-container {
            position: relative;
            background: #000;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
        }

        .media-video {
            width: 100%;
            max-height: 400px;
            background: #000;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .play-button {
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        /* Actions */
        .post-actions {
            display: flex;
            gap: 16px;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .action-btn {
            padding: 8px 16px;
            border-radius: 8px;
            background: #f8f9fa;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .action-btn.liked {
            background: #ffe6e6;
            color: #e74c3c;
        }

        /* Description */
        .description-box {
            padding: 16px;
        }

        .description-text {
            font-size: 14px;
            line-height: 1.5;
            color: #2c3e50;
        }

        .business-name-highlight {
            font-weight: 700;
            color: #2c3e50;
        }

        /* Contact */
        .contact-box {
            padding: 0 16px 12px 16px;
        }

        .contact-title {
            font-weight: 700;
            font-size: 13px;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        .contact-phone {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .contact-email {
            color: #3498db;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .post-footer {
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
        }

        .timestamp {
            font-size: 11px;
            color: #95a5a6;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-text {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }

        .empty-sub {
            font-size: 14px;
            color: #95a5a6;
        }

        /* Loading */
        .loading-container {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #7f8c8d;
            font-size: 14px;
        }

        /* Contact Modal */
        .contact-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .contact-modal-content {
            background: white;
            border-radius: 28px;
            width: 85%;
            max-width: 340px;
            padding: 24px;
            text-align: center;
        }

        .contact-modal-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .contact-modal-sub {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .contact-modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-call-btn, .contact-sms-btn, .contact-cancel-btn {
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        .contact-call-btn {
            background: #27ae60;
            color: white;
        }

        .contact-sms-btn {
            background: #3498db;
            color: white;
        }

        .contact-cancel-btn {
            background: #95a5a6;
            color: white;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 20px 16px;
                padding-top: 70px;
            }
            .mobile-menu-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile menu toggle -->
    <div class="mobile-menu-toggle" id="mobileMenuToggle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
            <path d="M3 12H21M3 6H21M3 18H21"/>
        </svg>
    </div>

    <div class="mteja-layout">
        <!-- SIDEBAR - Persistent navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <div class="logo-icon">D</div>
                    <div class="logo-text">
                        <h2>DukaMkononi</h2>
                        <p>Mteja Portal</p>
                    </div>
                </div>
            </div>

            <div class="nav-items">
                <a href="biashara.html" class="nav-item">
                    <div class="nav-icon">🏪</div>
                    <span class="nav-label">Biashara</span>
                </a>
                <a href="matangazo.html" class="nav-item active">
                    <div class="nav-icon">📢</div>
                    <span class="nav-label">Matangazo</span>
                </a>
                <a href="profaili.html" class="nav-item">
                    <div class="nav-icon">👤</div>
                    <span class="nav-label">Profaili</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">M</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Mteja</div>
                        <div class="user-role">Mteja</div>
                    </div>
                </div>
                <div class="logout-btn" id="logoutBtn">
                    <span>🚪</span>
                    <span>Ondoka</span>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="page-container" id="matangazoContent">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Inapakua matangazo...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Contact Modal -->
    <div id="contactModal" class="contact-modal">
        <div class="contact-modal-content">
            <div class="contact-modal-title" id="modalBusinessName">Wasiliana na Biashara</div>
            <div class="contact-modal-sub">Chagua njia ya kuwasiliana</div>
            <div class="contact-modal-buttons">
                <button class="contact-call-btn" id="callBtn">📞 Piga Simu</button>
                <button class="contact-sms-btn" id="smsBtn">💬 Tuma Ujumbe</button>
                <button class="contact-cancel-btn" id="cancelModalBtn">Ghairi</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // MATANGAZO SCREEN - Mteja Web Replica
        // With Sidebar Integration
        // ============================================
        
        const API_BASE_URL = '';
        
        let matangazo = [];
        let loading = true;
        let refreshing = false;
        let likedPosts = new Set();
        let userToken = null;
        let userName = null;
        let currentBusiness = null;

        // DOM Elements
        const container = document.getElementById('matangazoContent');
        const contactModal = document.getElementById('contactModal');
        const modalBusinessName = document.getElementById('modalBusinessName');
        const callBtn = document.getElementById('callBtn');
        const smsBtn = document.getElementById('smsBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatPhoneNumber(phone) {
            if (!phone || phone === 'null' || phone === 'undefined' || phone === 'Haijajazwa' || phone === 'Hakuna namba ya simu') {
                return null;
            }
            let clean = phone.replace(/[\s\-\(\)]/g, '');
            if (!clean.startsWith('+255') && !clean.startsWith('255')) {
                if (clean.length === 9) {
                    clean = `255${clean}`;
                } else if (clean.length === 10 && clean.startsWith('0')) {
                    clean = `255${clean.substring(1)}`;
                }
            }
            return clean;
        }

        function makePhoneCall(phoneNumber) {
            const formatted = formatPhoneNumber(phoneNumber);
            if (!formatted) {
                alert('Hakuna namba ya simu inayopatikana kwa biashara hii.');
                return;
            }
            window.location.href = `tel:${formatted}`;
        }

        function sendSMS(phoneNumber, businessName) {
            const formatted = formatPhoneNumber(phoneNumber);
            if (!formatted) {
                alert('Hakuna namba ya simu inayopatikana kwa biashara hii.');
                return;
            }
            const message = `Habari ${businessName}, naomba kufahamu zaidi kuhusu matangazo yako.`;
            window.location.href = `sms:${formatted}?body=${encodeURIComponent(message)}`;
        }

        function showContactModal(business) {
            currentBusiness = business;
            modalBusinessName.textContent = `Wasiliana na ${business.business_name || 'Biashara'}`;
            contactModal.style.display = 'flex';
        }

        function hideContactModal() {
            contactModal.style.display = 'none';
            currentBusiness = null;
        }

        function handleCall() {
            if (currentBusiness) {
                makePhoneCall(currentBusiness.phone);
            }
            hideContactModal();
        }

        function handleSMS() {
            if (currentBusiness) {
                sendSMS(currentBusiness.phone, currentBusiness.business_name || 'Biashara');
            }
            hideContactModal();
        }

        // Get current user from localStorage
        function getCurrentUser() {
            const token = localStorage.getItem('userToken');
            const userData = localStorage.getItem('userData');
            if (token && userData) {
                try {
                    return JSON.parse(userData);
                } catch(e) {
                    return null;
                }
            }
            return null;
        }

        // Update sidebar user info
        function updateSidebarUser() {
            const user = getCurrentUser();
            if (user) {
                const displayName = user.full_name || user.email?.split('@')[0] || 'Mteja';
                document.getElementById('userName').innerHTML = escapeHtml(displayName);
                document.getElementById('userAvatar').innerHTML = displayName.charAt(0).toUpperCase();
                userName = displayName;
            }
        }

        // Check authentication
        function checkAuth() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = '/login.html?role=mteja';
                return false;
            }
            const userRole = user.role || '';
            if (userRole !== 'customer' && userRole !== 'client' && userRole !== 'mteja') {
                alert('Huna ruhusa ya kuingia kwenye eneo la Mteja.');
                window.location.href = '/home.html';
                return false;
            }
            userToken = localStorage.getItem('userToken');
            return true;
        }

        // Fetch user likes
        async function fetchUserLikes() {
            if (!userToken) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/reactions/user/likes`, {
                    headers: {
                        'Authorization': `Bearer ${userToken}`,
                        'Accept': 'application/json',
                    },
                });
                
                if (response.ok) {
                    const data = await response.json();
                    likedPosts = new Set(data.likedPosts || []);
                }
            } catch (error) {
                console.error('Error fetching likes:', error);
            }
        }

        // Handle like action
        async function handleLike(postId, currentLikes) {
            if (!userToken) {
                alert('Tafadhali ingia kwenye akaunti yako kupenda matangazo.');
                return;
            }

            const wasLiked = likedPosts.has(postId);
            
            // Optimistic update
            if (wasLiked) {
                likedPosts.delete(postId);
            } else {
                likedPosts.add(postId);
            }
            
            // Update UI immediately
            const postIndex = matangazo.findIndex(p => p.id === postId);
            if (postIndex !== -1) {
                matangazo[postIndex].like_count = wasLiked ? Math.max(matangazo[postIndex].like_count - 1, 0) : matangazo[postIndex].like_count + 1;
            }
            render();

            try {
                const response = await fetch(`${API_BASE_URL}/api/reactions/like`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}`,
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({ matangazo_id: postId }),
                });

                if (!response.ok) {
                    // Revert on error
                    if (wasLiked) {
                        likedPosts.add(postId);
                    } else {
                        likedPosts.delete(postId);
                    }
                    if (postIndex !== -1) {
                        matangazo[postIndex].like_count = currentLikes;
                    }
                    render();
                    alert('Imeshindwa kupenda tangazo. Tafadhali jaribu tena.');
                }
            } catch (error) {
                // Revert on error
                if (wasLiked) {
                    likedPosts.add(postId);
                } else {
                    likedPosts.delete(postId);
                }
                if (postIndex !== -1) {
                    matangazo[postIndex].like_count = currentLikes;
                }
                render();
                alert('Imeshindwa kupenda tangazo. Angalia muunganisho wako.');
            }
        }

        // Handle report action
        async function handleReport(post) {
            if (!userToken) {
                alert('Tafadhali ingia kwenye akaunti yako kuripoti matangazo.');
                return;
            }

            if (confirm(`Una hakika unataka kuripoti matangazo ya "${post.users?.business_name || 'Biashara'}"?`)) {
                const currentReports = post.report_count || 0;
                
                // Optimistic update
                const postIndex = matangazo.findIndex(p => p.id === post.id);
                if (postIndex !== -1) {
                    matangazo[postIndex].report_count = currentReports + 1;
                }
                render();

                try {
                    const response = await fetch(`${API_BASE_URL}/api/reactions/report`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${userToken}`,
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({ matangazo_id: post.id }),
                    });

                    if (response.ok) {
                        alert('Asante! Tangazo limeripotiwa.');
                    } else {
                        // Revert on error
                        if (postIndex !== -1) {
                            matangazo[postIndex].report_count = currentReports;
                        }
                        render();
                        alert('Imeshindwa kuwasilisha ripoti.');
                    }
                } catch (error) {
                    if (postIndex !== -1) {
                        matangazo[postIndex].report_count = currentReports;
                    }
                    render();
                    alert('Imeshindwa kuwasilisha ripoti. Angalia muunganisho wako.');
                }
            }
        }

        // Handle order/contact
        function handleOrder(post) {
            const phoneNumber = post.users?.phone || '';
            const businessName = post.users?.business_name || post.title || 'Biashara';
            
            if (!phoneNumber || phoneNumber.trim() === '' || phoneNumber === 'Hakuna namba ya simu') {
                alert('Hakuna namba ya simu inayopatikana kwa biashara hii.');
                return;
            }

            showContactModal({ phone: phoneNumber, business_name: businessName });
        }

        // Fetch advertisements from API
        async function fetchMatangazo() {
            loading = true;
            render();
            
            try {
                console.log('📢 Inapakua matangazo...');
                const response = await fetch(`${API_BASE_URL}/api/matangazo`, {
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                    },
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                matangazo = data || [];
                console.log(`📢 Matangazo yamepakuliwa: ${matangazo.length}`);
                
                if (userToken) {
                    await fetchUserLikes();
                }
                
            } catch (error) {
                console.error('Error fetching matangazo:', error);
                alert('Imeshindwa kupakua matangazo. Tafadhali jaribu tena.');
                matangazo = [];
            } finally {
                loading = false;
                refreshing = false;
                render();
            }
        }

        function refreshData() {
            refreshing = true;
            fetchMatangazo();
        }

        // Render the UI
        function render() {
            if (loading) {
                container.innerHTML = `
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Inapakua matangazo...</div>
                    </div>
                `;
                return;
            }
            
            if (matangazo.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📢</div>
                        <div class="empty-text">Hakuna matangazo yanayopatikana</div>
                        <div class="empty-sub">Wa kwanza kutangaza!</div>
                        <button class="refresh-btn" id="refreshBtn" style="margin-top:20px;background:#667eea;color:white;padding:10px 24px;border-radius:10px;border:none;cursor:pointer;">Pakia Upya</button>
                    </div>
                `;
                const refreshBtn = document.getElementById('refreshBtn');
                if (refreshBtn) refreshBtn.addEventListener('click', () => refreshData());
                return;
            }
            
            const postsHtml = matangazo.map(post => {
                const isLiked = likedPosts.has(post.id);
                const businessName = post.users?.business_name || post.title || 'Biashara';
                const ownerName = post.users?.full_name || 'Mfanyabiashara';
                const phoneNumber = post.users?.phone || 'Hakuna namba ya simu';
                const email = post.users?.email || '';
                const createdAt = new Date(post.created_at).toLocaleDateString('sw-TZ');
                
                return `
                    <div class="post-card" data-post-id="${post.id}">
                        <div class="post-header">
                            <div class="business-info">
                                <div class="avatar">${escapeHtml(businessName.charAt(0).toUpperCase() || 'B')}</div>
                                <div class="business-details">
                                    <div class="business-name">${escapeHtml(businessName)}</div>
                                    <div class="owner-name">${escapeHtml(ownerName)}</div>
                                </div>
                            </div>
                            <button class="order-btn" data-id="${post.id}">Agiza</button>
                        </div>
                        
                        <div class="media-container">
                            ${post.media_type === 'video' ? 
                                `<video class="media-video" controls poster="${post.thumbnail_url || ''}">
                                    <source src="${post.media_url}" type="video/mp4">
                                    Your browser does not support video.
                                </video>` :
                                `<img class="media-image" src="${post.media_url}" alt="Tangazo" onerror="this.src='https://via.placeholder.com/400?text=No+Image'">`
                            }
                        </div>
                        
                        <div class="post-actions">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" data-like="${post.id}" data-likes="${post.like_count || 0}">
                                ${isLiked ? '❤️' : '🤍'} Penda (${post.like_count || 0})
                            </button>
                            <button class="action-btn" data-report='${JSON.stringify(post).replace(/'/g, "&#39;")}'>
                                ⚠️ Ripoti (${post.report_count || 0})
                            </button>
                        </div>
                        
                        <div class="description-box">
                            <div class="description-text">
                                <span class="business-name-highlight">${escapeHtml(businessName)}:</span> ${escapeHtml(post.description)}
                            </div>
                        </div>
                        
                        <div class="contact-box">
                            <div class="contact-title">📞 Wasiliana Nasi:</div>
                            <div class="contact-phone" data-phone="${escapeHtml(phoneNumber)}" data-name="${escapeHtml(businessName)}">${escapeHtml(phoneNumber)}</div>
                            ${email ? `<div class="contact-email">📧 ${escapeHtml(email)}</div>` : ''}
                            <div class="contact-phone" style="font-style:italic;color:#7f8c8d;">Biashara: ${escapeHtml(businessName)}</div>
                        </div>
                        
                        <div class="post-footer">
                            <div class="timestamp">Imechapishwa: ${createdAt}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            const userGreeting = userName ? `Karibu, ${escapeHtml(userName)}! ` : '';
            const loginWarningHtml = !userToken ? `
                <div class="login-warning">
                    <div class="login-warning-text">⚠️ Ingia kwenye akaunti yako kupenda au kuripoti matangazo</div>
                </div>
            ` : '';
            
            container.innerHTML = `
                <div class="list-header">
                    <div class="screen-title">Matangazo</div>
                    <div class="screen-subtitle">${userGreeting}Gundua bidhaa na huduma mpya</div>
                    <div class="info-text">📊 ${matangazo.length} matangazo yanapatikana</div>
                    ${loginWarningHtml}
                </div>
                ${postsHtml}
                <div style="text-align:center;margin-top:16px;">
                    <button id="refreshBtn" style="background:#667eea;color:white;padding:10px 24px;border-radius:10px;border:none;cursor:pointer;">🔄 Pakia Upya</button>
                </div>
            `;
            
            // Attach order button events
            document.querySelectorAll('.order-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    const post = matangazo.find(p => p.id === id);
                    if (post) handleOrder(post);
                });
            });
            
            // Attach like button events
            document.querySelectorAll('[data-like]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.getAttribute('data-like'));
                    const currentLikes = parseInt(btn.getAttribute('data-likes'));
                    const post = matangazo.find(p => p.id === id);
                    if (post) handleLike(id, currentLikes);
                });
            });
            
            // Attach report button events
            document.querySelectorAll('[data-report]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const postData = JSON.parse(btn.getAttribute('data-report'));
                    handleReport(postData);
                });
            });
            
            // Attach phone click events
            document.querySelectorAll('.contact-phone').forEach(phoneEl => {
                phoneEl.addEventListener('click', (e) => {
                    const phone = phoneEl.getAttribute('data-phone');
                    const name = phoneEl.getAttribute('data-name');
                    if (phone && phone !== 'Hakuna namba ya simu') {
                        showContactModal({ phone: phone, business_name: name });
                    }
                });
            });
            
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) refreshBtn.addEventListener('click', () => refreshData());
        }

        // Sidebar functions
        function setupSidebar() {
            const toggle = document.getElementById('mobileMenuToggle');
            const sidebar = document.getElementById('sidebar');
            if (toggle && sidebar) {
                toggle.addEventListener('click', () => sidebar.classList.toggle('open'));
            }
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.clear();
                    window.location.href = '/login.html?role=mteja';
                });
            }
            
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    const sidebar = document.getElementById('sidebar');
                    const toggle = document.getElementById('mobileMenuToggle');
                    if (sidebar && sidebar.classList.contains('open') && 
                        !sidebar.contains(e.target) && 
                        toggle && !toggle.contains(e.target)) {
                        sidebar.classList.remove('open');
                    }
                }
            });
        }

        // Modal event listeners
        function setupModal() {
            if (callBtn) callBtn.addEventListener('click', handleCall);
            if (smsBtn) smsBtn.addEventListener('click', handleSMS);
            if (cancelModalBtn) cancelModalBtn.addEventListener('click', hideContactModal);
            
            contactModal.addEventListener('click', (e) => {
                if (e.target === contactModal) {
                    hideContactModal();
                }
            });
        }

        // Initialize
        async function init() {
            if (!checkAuth()) return;
            updateSidebarUser();
            setupSidebar();
            setupModal();
            await fetchMatangazo();
        }
        
        init();
    </script>
</body>
</html>
